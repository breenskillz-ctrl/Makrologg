name: Slett utgivelser fra før historikken ble renset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Slett gamle utgivelser, merker og gren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in v1.0.2 v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.0.7 v1.0.8 v1.0.9; do
            gh release delete "$t" --yes --cleanup-tag || gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" --silent || echo "Kunne ikke slette $t"
          done
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/flytt-nokkel-til-secrets" --silent || echo "Grenen var allerede borte"
