name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg APK
        run: gradle assembleRelease --no-daemon

      - name: Gi APK-en et lesbart navn
        run: cp app/build/outputs/apk/release/app-release.apk Makrologg.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Makrologg-apk
          path: Makrologg.apk

      - name: Publiser under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Makrologg 1.0.${{ github.run_number }}
          body: Last ned Makrologg.apk under og åpne den på telefonen for å installere.
          files: Makrologg.apk
          make_latest: true
