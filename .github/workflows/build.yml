name: Bygg APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/src/main/assets/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Hent signeringsnøkkel fra secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Mangler secret KEYSTORE_BASE64. Legg den inn under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Bygg APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: makrologg
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Slett nøkkelen fra byggeserveren
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Gi APK-en et lesbart navn
        run: cp app/build/outputs/apk/release/app-release.apk Makrologg.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Makrologg-apk
          path: Makrologg.apk

      - name: Publiser under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Makrologg 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Ny versjon av Makrologg.' }}
          files: Makrologg.apk
          make_latest: true
