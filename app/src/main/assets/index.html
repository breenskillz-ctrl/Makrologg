<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone app — summary dial on top, meal cards, bottom tab bar, sheets slide up for adding food */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#e3e9e7; --line:#d3dcd9;
  --fg:#14211e; --muted:#5b6b67;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#d5ebe5;
  --prot:#2e64c8; --fat:#d08a14; --carb:#8f4fc4; --kcal:#0f6b5c;
  --over:#c2412d; --ok:#2f8a4a;
  --shadow:0 1px 2px rgba(20,33,30,.06),0 6px 20px rgba(20,33,30,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1513; --surface:#16211e; --surface-2:#1f2c29; --line:#2a3a36;
  --fg:#e6efec; --muted:#93a5a0;
  --accent:#4cc3a8; --accent-fg:#06201a; --accent-soft:#16352e;
  --prot:#6f9cf0; --fat:#e9aa45; --carb:#bb86ec; --kcal:#4cc3a8;
  --over:#f07a64; --ok:#5cc47a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1513; --surface:#16211e; --surface-2:#1f2c29; --line:#2a3a36;
  --fg:#e6efec; --muted:#93a5a0;
  --accent:#4cc3a8; --accent-fg:#06201a; --accent-soft:#16352e;
  --prot:#6f9cf0; --fat:#e9aa45; --carb:#bb86ec; --kcal:#4cc3a8;
  --over:#f07a64; --ok:#5cc47a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:18px;box-shadow:var(--shadow)}
.datenav .dlabel{min-width:104px;text-align:center;font-weight:600;font-size:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.summary{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.dial{position:relative;width:132px;height:132px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.dial .small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.mrow .mtop{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.mrow .mtop b{font-weight:600}
.mrow .mtop span{color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px}
.leftrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.leftrow div{background:var(--surface-2);border-radius:12px;padding:8px 4px}
.leftrow b{display:block;font-family:var(--display);font-size:19px;line-height:1.2}
.leftrow span{font-size:11px;color:var(--muted)}
.leftrow .ov b{color:var(--over)}
.kline{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.kline b{color:var(--fg);font-weight:600}
.meal{padding:0}
.meal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:8px}
.meal h3{margin:0;font-family:var(--display);font-weight:600;font-size:17px}
.meal .mk{font-size:13px;color:var(--muted)}
.meal ul{list-style:none;margin:0;padding:0}
.meal li{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.meal li:active{background:var(--surface-2)}
.meal li .nm{min-width:0}
.meal li .nm div{font-weight:500;overflow-wrap:anywhere}
.meal li .nm small{color:var(--muted);font-size:12px}
.meal li .kc{font-weight:600;white-space:nowrap}
.meal .mf{display:flex;gap:8px;padding:10px 16px 14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--surface-2);font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--line)}
.btn.block{width:100%;padding:13px 16px;font-size:15px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px}
.water .glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:18px;height:24px;border:2px solid var(--prot);border-top:0;border-radius:0 0 5px 5px;opacity:.35}
.glass.f{background:var(--prot);opacity:1}
.sect{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px -4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px}
.sheet .sh h2{margin:0;font-family:var(--display);font-size:20px;font-weight:800}
.sheet .x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex-shrink:0}
.sheet .sb{overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .inp{padding:10px 8px;text-align:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.tool svg{width:22px;height:22px;flex-shrink:0;color:var(--accent)}
.tool small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden}
.list button{border:0;background:transparent;text-align:left;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);align-items:center}
.list button:first-child{border-top:0}
.list button .nm{min-width:0;overflow-wrap:anywhere}
.list small{color:var(--muted);font-size:12px}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:1px}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.preview div{background:var(--surface);border-radius:12px;padding:10px 4px}
.preview b{display:block;font-size:18px;font-family:var(--display)}
.preview span{font-size:11px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--over)}
.busy{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.hist svg{width:100%;height:auto;display:block}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.statrow b{display:block;font-family:var(--display);font-size:18px}
.statrow span{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:90%}
.upd{background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.upd .btn{background:var(--accent-fg);color:var(--accent);align-self:flex-start}
.upd small{opacity:.85;white-space:pre-line}
.meal.next{outline:2px solid var(--accent);outline-offset:-2px}
.meal .mt{display:flex;align-items:center;gap:8px;min-width:0}
.tm{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.fixed{padding:0 16px 2px;font-size:13px;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tgl{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.tgl input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:inherit}
.nextline{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.slotrow{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.tplrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.tplrow:first-child{border-top:0}
.tplrow button:first-child{flex:1;min-width:0}
.tplrow .x{flex:0 0 34px;height:34px;padding:0;justify-content:center;margin-right:10px;border-top:0}
.wake{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px;padding:0 16px 4px}
.thumb{max-height:160px;border-radius:12px;object-fit:cover;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border-radius:12px}
.checkrow input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.checkrow .nm{flex:1;min-width:0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
</style>

</head><body><div class="app" id="app">

<script>
"use strict";
/* ---------- base food list (per 100 g, approx. Matvaretabellen-nivå) ---------- */
const BASE = [
 ["Havregryn",367,13,7,58,["1 dl",35]],["Grovbrød",240,9,3.5,40,["1 skive",40]],["Kneippbrød",235,8,2.5,42,["1 skive",40]],

 ["Gulost lett 16 %",270,30,16,0,["1 skive",10]],["Brunost",465,9.5,30,40,["1 skive",10]],["Smør",740,0.6,82,0.6,["1 ts",5]],
 ["Makrell i tomat",190,13,14,4,["Påsmurt skive",25]],["Leverpostei",230,10,18,6,["Påsmurt skive",15]],["Kokt skinke",105,20,2.5,1,["1 skive",12]],
 ["Kalkunpålegg",100,21,1.5,1,["1 skive",12]],["Peanøttsmør",600,25,50,12,["1 ss",15]],["Banan",88,1.1,0.3,20,["1 banan",120]],
 ["Eple",52,0.3,0.2,12,["1 eple",150]],["Appelsin",47,1,0.2,9.5,["1 appelsin",160]],["Blåbær",51,0.7,0.6,9,["1 dl",65]],

 ["Appelsinjuice",43,0.6,0.1,9.5,["1 glass",200]],["Øl 4,7 %",43,0.4,0,3.5,["0,5 l",500]],["Kaffe svart",1,0.1,0,0,["1 kopp",200]],
 ["Hummus",280,7,23,10,["2 ss",30]],["Rømme lett 18 %",185,3,18,3.5,["1 ss",15]],["Grillpølse",230,11,19,4,["1 pølse",70]],
 ["Lompe",205,4.5,1.5,43,["1 lompe",30]],["Pølsebrød",270,8,4,50,["1 brød",45]],["Tortillalefse",310,8.5,7.5,52,["1 lefse",40]],

].map((r,i)=>({id:"b"+i,name:r[0],per:{kcal:r[1],p:r[2],f:r[3],c:r[4]},portion:r[5]?{label:r[5][0],g:r[5][1]}:null,base:true}));

const MEALS = [["frokost","Frokost"],["lunsj","Lunsj"],["middag","Middag"],["kvelds","Kveldsmat"],["snacks","Mellommåltid"],["pre","Pre-workout"]];
const DEFAULT_GOALS = {kcal:2200,p:150,f:70,c:240,water:8};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(n||0);
const r1 = n => Math.round((n||0)*10)/10;
const fmt1 = n => String(r1(n)).replace(".",",");
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const calKey = () => keyOf(new Date());
/* "today" follows when you got up (shift work): a registered wake-up counts for 20 hours */
function todayKey(){ const w=(typeof S!=="undefined"&&S.docs)?S.docs.wake:null, n=Date.now();
  if(w&&w.day&&n-w.at<20*3600e3&&n>=w.at-3600e3) return w.day; return calKey(); }
const DAYN = ["søn","man","tir","ons","tor","fre","lør"];
const MON = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
function dateLabel(k){ const t=todayKey(); if(k===t) return "I dag"; if(k===addDays(t,-1)) return "I går"; if(k===addDays(t,1)) return "I morgen"; const d=parseKey(k); return DAYN[d.getDay()]+" "+d.getDate()+". "+MON[d.getMonth()]; }
const numIn = v => { const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; };
const calc = (per,g) => ({kcal:per.kcal*g/100,p:per.p*g/100,f:per.f*g/100,c:per.c*g/100});
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- store: db capability, falls back to browser storage ---------- */
const S = { docs:{}, mode:"local", db:null, uidv:null, ready:false };
const LSKEY="makrologg.v1";
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||"{}"); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S.docs)); }catch(e){} }
const queues = {};
function writeDoc(id, data){
  S.docs[id] = data; render(); reschedule();
  if(S.mode!=="db"){ lsSave(); return; }
  const ref = S.db.doc("data/users/"+S.uidv+"/"+id);
  queues[id] = (queues[id]||Promise.resolve()).then(()=>ref.set(data)).catch(e=>{
    if(e && e.code==="quota_exceeded") toast("Lagringen er full. Slett noen gamle dager.");
    else toast("Kunne ikke lagre. Sjekk nettet.");
  });
}
function delDoc(id){
  delete S.docs[id]; render();
  if(S.mode!=="db"){ lsSave(); return; }
  const ref=S.db.doc("data/users/"+S.uidv+"/"+id);
  queues[id]=(queues[id]||Promise.resolve()).then(()=>ref.delete()).catch(()=>{});
}
const clone = o => JSON.parse(JSON.stringify(o||{}));
const dayDoc = k => S.docs["day-"+k] || {kind:"day",date:k,entries:[],water:0};
const goals = () => Object.assign({}, DEFAULT_GOALS, (S.docs.profile||{}).goals||{});
const foodsDoc = () => S.docs.foods || {kind:"foods",items:{}};
const weightsDoc = () => S.docs.weights || {kind:"weights",items:{}};

/* ---------- day plan ---------- */
const HOUR=3600e3;
const DEFAULT_PLAN = {defaultWake:"07:00", reminders:false,
  slots:{frokost:{on:true,off:30,tpl:""},lunsj:{on:true,off:270,tpl:""},middag:{on:true,off:540,tpl:""},kvelds:{on:true,off:780,tpl:""},snacks:{on:false,off:390,tpl:""}},
  pre:{before:90,tpl:"",extraKcal:300,defaultTime:"17:00"}};
function plan(){ const p=(S.docs.profile||{}).plan||{}, out=clone(DEFAULT_PLAN);
  if(p.defaultWake) out.defaultWake=p.defaultWake; if(p.reminders!=null) out.reminders=!!p.reminders;
  for(const k in out.slots) Object.assign(out.slots[k], (p.slots||{})[k]||{});
  Object.assign(out.pre, p.pre||{}); return out; }
const mealsDoc = () => S.docs.meals || {kind:"meals",items:{}};
const hhmm = ts => { const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
function clockOn(k,t){ const [h,m]=String(t||"07:00").split(":").map(Number); const d=parseKey(k); d.setHours(h||0,m||0,0,0); return d.getTime(); }
function wakeTs(k){ const d=dayDoc(k); return d.wake&&d.wake.at ? d.wake.at : clockOn(k, plan().defaultWake); }
const isTraining = k => !!(dayDoc(k).train&&dayDoc(k).train.on);
function trainTs(k){ const d=dayDoc(k), w=wakeTs(k); let t=clockOn(k,(d.train&&d.train.time)||plan().pre.defaultTime); while(t<w-HOUR) t+=24*HOUR; return t; }
function daySchedule(k){
  const pl=plan(), w=wakeTs(k), out=[];
  for(const [mk] of MEALS){ const sl=pl.slots[mk]; if(sl&&sl.on) out.push({meal:mk,at:w+sl.off*60000,tpl:sl.tpl}); }
  if(isTraining(k)){ const tt=trainTs(k); out.push({meal:"pre",at:tt-pl.pre.before*60000,tpl:pl.pre.tpl,train:tt}); }
  return out.sort((a,b)=>a.at-b.at);
}
function goalsFor(k){ const g=goals(); if(isTraining(k)){ const x=Number(plan().pre.extraKcal)||0; g.kcal+=x; g.c+=x*0.7/4; g.p+=x*0.3/4; g.extra=x; } return g; }
const tplTotals = t => (t.items||[]).reduce((a,i)=>{ const v=calc(i.per,i.g); a.kcal+=v.kcal;a.p+=v.p;a.f+=v.f;a.c+=v.c; return a; },{kcal:0,p:0,f:0,c:0});
const tplById = id => id ? (mealsDoc().items||{})[id] : null;
function fmtDur(ms){ const m=Math.round(Math.abs(ms)/60000), h=Math.floor(m/60), r=m%60; return h?`${h} t${r?` ${r} min`:""}`:`${r} min`; }
const hasMeal = (d,mk) => (d.entries||[]).some(e=>e.meal===mk);
function nextSlot(k){ if(k!==todayKey()) return null; const d=dayDoc(k), now=Date.now();
  return daySchedule(k).find(x=>!hasMeal(d,x.meal) && x.at>now-60*60000) || null; }
function logTemplate(k, mk, tp, water){
  const d=clone(dayDoc(k)); d.kind="day"; d.date=k; d.entries=d.entries||[];
  for(const i of tp.items||[]){ const v=calc(i.per,i.g); d.entries.push({id:uid(),meal:mk,name:i.name,g:i.g,per:i.per,portion:i.portion||null,foodId:i.foodId||null,kcal:v.kcal,p:v.p,f:v.f,c:v.c}); }
  if(water) d.water=(d.water||0)+1;
  writeDoc("day-"+k,d);
}
function setWake(ts){
  const day=keyOf(new Date(ts));
  UI.date=day; UI.lastToday=day; UI.wakeEdit=false;
  const d=clone(dayDoc(day)); d.kind="day"; d.date=day; d.wake={at:ts};
  S.docs.wake={kind:"wake",at:ts,day};
  writeDoc("day-"+day,d); writeDoc("wake",S.docs.wake);
  toast(`Sto opp kl ${hhmm(ts)}. Måltidstidene er oppdatert.`);
}
function wakeFromClock(t){ let ts=clockOn(calKey(),t); if(ts>Date.now()+30*60000) ts-=24*HOUR; return ts; }
function recentWakes(){ const c={};
  Object.keys(S.docs).filter(k=>k.startsWith("day-")).sort().reverse().slice(0,30).forEach(k=>{ const w=S.docs[k].wake; if(w&&w.at){ const t=hhmm(w.at); c[t]=(c[t]||0)+1; } });
  const arr=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,3); const dw=plan().defaultWake;
  if(!arr.includes(dw)&&arr.length<3) arr.push(dw); return arr.sort(); }

/* ---------- reminders (Android) ---------- */
let schedT=null;
function reschedule(){ clearTimeout(schedT); schedT=setTimeout(pushReminders,500); }
const canRemind = () => !!(window.Android&&Android.scheduleReminders);
function hashId(str){ let h=7; for(const c of str) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h)%2000000000+1; }
function reminderList(){
  const pl=plan(); if(!pl.reminders) return [];
  const now=Date.now(), t=todayKey(), out=[]; let lastToday=0;
  for(const k of [t, addDays(t,1)]){
    const d=dayDoc(k);
    for(const sl of daySchedule(k)){
      if(k===t) lastToday=Math.max(lastToday, sl.at);
      else if(sl.at<lastToday+5*HOUR) continue;
      if(sl.at<now+30000 || hasMeal(d,sl.meal)) continue;
      const tp=tplById(sl.tpl), what=tp?`${tp.name}, ${r0(tplTotals(tp).kcal)} kcal. `:"";
      const text = sl.meal==="pre" ? `Trening kl ${hhmm(sl.train)}. ${what||"Spis litt nå. "}Husk et glass vann.` : `${what||"Tid for å spise. "}Husk et glass vann.`;
      out.push({id:hashId(k+":"+sl.meal), at:sl.at, title:`${meal(sl.meal)} kl ${hhmm(sl.at)}`, text, slot:sl.meal, day:k});
    }
  }
  return out;
}
function pushReminders(){ if(!canRemind()||!S.ready) return; try{ Android.scheduleReminders(JSON.stringify(reminderList())); }catch(e){} }
function notifState(){ try{ return window.Android&&Android.notifPermission ? Android.notifPermission() : "none"; }catch(e){ return "none"; } }
window.onNotifPermission = st => { if(st!=="granted") toast("Varsler er slått av for Makrologg"); render(); };
window.onReminderOpen = (slot, day) => { UI.tab="dag"; if(day) UI.date=day; render(); openSlot(slot, day||UI.date); };
function openSlot(slot,k){ const sl=daySchedule(k).find(x=>x.meal===slot); openSheet({type:"slot",slot,day:k,at:sl?sl.at:null,tpl:sl?sl.tpl:""}); }

function initStore(){ S.docs=lsLoad(); S.ready=true; UI.date=todayKey(); UI.lastToday=UI.date; render(); reschedule(); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden||!S.ready) return;
  const t=todayKey(); if(UI.lastToday!==t){ if(UI.date===UI.lastToday) UI.date=t; UI.lastToday=t; } render(); reschedule(); });

function aiErr(e){
  const c=e&&e.code;
  if(c==="not_granted") return "Du må tillate Claude for å bruke denne funksjonen.";
  if(c==="rate_limited") return "For mange forespørsler. Vent litt og prøv igjen.";
  if(c==="cancelled") return "Avbrutt.";
  if(c==="images_unavailable") return "Bilder kan ikke sendes til Claude her.";
  return "Claude svarte ikke. Prøv igjen, eller fyll inn manuelt.";
}

function render(){
  // tabs
  $("#tabs").innerHTML = [["dag","Dag",ICON.day],["plan","Plan",ICON.clock],["hist","Historikk",ICON.hist],["mal","Mål og vekt",ICON.goal]]
    .map(([k,l,i])=>`<button data-act="tab" data-v="${k}" class="${UI.tab===k?"on":""}">${i}${l}</button>`).join("");
  $("#datenav").innerHTML = UI.tab==="dag" ? `<button data-act="day" data-v="-1" aria-label="Forrige dag">‹</button><div class="dlabel">${dateLabel(UI.date)}</div><button data-act="day" data-v="1" aria-label="Neste dag">›</button>` : "";
  if(!S.ready){ return; }
  const m=$("#main");
  if(UI.tab==="dag") m.innerHTML = updateBanner() + viewDay();
  else if(UI.tab==="hist") m.innerHTML = viewHist();
  else if(UI.tab==="plan") m.innerHTML = viewPlan();
  else m.innerHTML = viewGoals();
}

function macroRow(label,val,goal,color){
  const pct=Math.min(100, goal? val/goal*100:0);
  const over = val>goal*1.05;
  return `<div class="mrow"><div class="mtop"><b>${label}</b><span class="num">${r0(val)} / ${r0(goal)} g</span></div>
  <div class="bar"><i style="width:${pct}%;background:${over?"var(--over)":color}"></i></div></div>`;
}

function viewDay(){
  const g=goalsFor(UI.date), d=dayDoc(UI.date), t=totals(d);
  const left = g.kcal - t.kcal;
  const C=2*Math.PI*56, frac=Math.min(1, t.kcal/(g.kcal||1));
  const over = t.kcal>g.kcal;
  let h = `<section class="card summary">
    <div class="dial"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle cx="66" cy="66" r="56" fill="none" stroke="${over?"var(--over)":"var(--kcal)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}"/></svg>
      <div class="center"><div class="big num">${r0(Math.abs(left))}</div><div class="small">${over?"kcal over":"kcal igjen"}</div></div></div>
    <div class="macros">${macroRow("Protein",t.p,g.p,"var(--prot)")}${macroRow("Karbohydrater",t.c,g.c,"var(--carb)")}${macroRow("Fett",t.f,g.f,"var(--fat)")}</div>
    <div class="leftrow num">${[["kcal","kcal",""],["p","protein"," g"],["c","karbo"," g"],["f","fett"," g"]].map(([k,l,u])=>{ const r=g[k]-t[k], ov=r<-0.5;
      return `<div class="${ov?"ov":""}"><b>${ov?"+":""}${r0(Math.abs(r))}${u}</b><span>${ov?l+" over":l+" igjen"}</span></div>`; }).join("")}</div>
    <div class="kline"><span>Spist <b class="num">${r0(t.kcal)}</b> kcal</span><span>Mål <b class="num">${r0(g.kcal)}</b> kcal${g.extra?` <span class="num">(+${r0(g.extra)} trening)</span>`:""}</span></div>
  </section>`;
  h += planCard(UI.date);
  if(!(S.docs.profile)) h += `<section class="card"><div style="font-weight:600;margin-bottom:4px">Sett dine egne mål</div><div class="note" style="margin-bottom:10px">Målene over er standardverdier. Regn ut dine basert på vekt, høyde og aktivitet.</div><button class="btn primary" data-act="tab" data-v="mal">Regn ut mål</button></section>`;
  const yday = dayDoc(addDays(UI.date,-1));
  const sch=daySchedule(UI.date), at={}; sch.forEach(x=>at[x.meal]=x);
  const nx=nextSlot(UI.date);
  const keys=MEALS.map(x=>x[0]).filter(k=>k!=="pre"||isTraining(UI.date)||hasMeal(d,"pre"));
  keys.sort((a,b)=>{ const x=at[a]?at[a].at:Infinity, y=at[b]?at[b].at:Infinity; return x===y?0:x-y; });
  for(const mk of keys){ const ml=meal(mk);
    const es=(d.entries||[]).filter(e=>e.meal===mk);
    const kc=es.reduce((a,e)=>a+e.kcal,0);
    const yHas=(yday.entries||[]).some(e=>e.meal===mk);
    const tp=at[mk]&&!es.length?tplById(at[mk].tpl):null;
    h += `<section class="card meal ${nx&&nx.meal===mk?"next":""}"><div class="mh"><div class="mt"><h3>${ml}</h3>${at[mk]?`<span class="tm num">${hhmm(at[mk].at)}</span>`:""}</div><span class="mk num">${es.length?r0(kc)+" kcal":""}</span></div>
      ${tp?`<div class="fixed">Fast: ${esc(tp.name)} · ${r0(tplTotals(tp).kcal)} kcal</div>`:""}
      ${es.length?`<ul>${es.map(e=>`<li data-act="editEntry" data-v="${e.id}"><div class="nm"><div>${esc(e.name)}${e.est?'<span class="tag">anslag</span>':""}</div><small class="num">${r0(e.g)} g · P ${fmt1(e.p)} · K ${fmt1(e.c)} · F ${fmt1(e.f)}</small></div><div class="kc num">${r0(e.kcal)}</div></li>`).join("")}</ul>`:""}
      <div class="mf">${tp?`<button class="btn primary" data-act="logSlotTpl" data-v="${mk}">Logg fast måltid</button><button class="btn ghost" data-act="add" data-v="${mk}">Noe annet</button>`
        :`<button class="btn primary" data-act="add" data-v="${mk}">+ Legg til</button>${!es.length&&yHas?`<button class="btn ghost" data-act="copyY" data-v="${mk}">Samme som i går</button>`:""}`}${es.length?`<button class="btn ghost" data-act="saveAsTpl" data-v="${mk}">Lagre som fast</button>`:""}</div></section>`;
  }
  const w=d.water||0, wg=g.water||8;
  h += `<section class="card water"><div><div style="font-weight:600">Vann</div><div class="note num">${w} av ${wg} glass (2,5 dl)</div>
    <div class="glasses" style="margin-top:6px">${Array.from({length:Math.max(wg,w)},(_,i)=>`<span class="glass ${i<w?"f":""}"></span>`).join("")}</div></div>
    <div class="row"><button class="btn" data-act="water" data-v="-1" aria-label="Ett glass mindre">−</button><button class="btn primary" data-act="water" data-v="1" aria-label="Ett glass til">+</button></div></section>`;
  return h;
}

function planCard(k){
  const d=dayDoc(k), isToday=k===todayKey(), pl=plan(), reg=d.wake&&d.wake.at;
  let h="";
  if(isToday && (!reg || UI.wakeEdit)){
    h+=`<section class="card wake"><div><div style="font-weight:600">${reg?"Når sto du opp?":"God morgen! Når sto du opp?"}</div>
      <div class="note">Appen regner ut når du skal spise ut fra det. Fint når du går skift.</div></div>
      <div class="row"><button class="btn primary" data-act="wakeNow">Nå</button>${recentWakes().map(t=>`<button class="chip num" data-act="wakeAt" data-v="${t}">${t}</button>`).join("")}</div>
      <div class="row"><input class="inp num" type="time" id="wakeIn" aria-label="Tidspunkt du sto opp" style="flex:1;min-width:0" value="${reg?hhmm(d.wake.at):""}"><button class="btn" data-act="wakeSet">Lagre</button>${reg?`<button class="btn ghost" data-act="wakeCancel">Avbryt</button>`:""}</div></section>`;
  }
  const nx=nextSlot(k), now=Date.now();
  let nextTxt="";
  if(nx){ const diff=nx.at-now;
    nextTxt=`<div class="nextline">${Math.abs(diff)<=20*60000?"Nå":"Neste"}: <b>${esc(meal(nx.meal))} kl ${hhmm(nx.at)}</b>${diff>20*60000?` · om ${fmtDur(diff)}`:diff<-20*60000?` · ${fmtDur(diff)} siden`:""}. Husk et glass vann.</div>`; }
  h+=`<section class="card plan"><div class="prow"><div class="note">${reg?`Sto opp kl <b class="num">${hhmm(d.wake.at)}</b>`:`Står opp kl <b class="num">${esc(pl.defaultWake)}</b> (vanlig tid)`}${isToday&&reg&&!UI.wakeEdit?` · <button class="link" data-act="wakeEdit">Endre</button>`:""}</div>
      <label class="tgl"><input type="checkbox" id="trainChk" ${isTraining(k)?"checked":""}><span>Treningsdag</span></label></div>
    ${isTraining(k)?`<div class="prow"><div class="row"><label for="trainTime" class="note">Trening kl</label><input class="inp num" type="time" id="trainTime" value="${hhmm(trainTs(k))}" style="width:auto"></div><span class="note num">Pre-workout kl ${hhmm(trainTs(k)-pl.pre.before*60000)} · +${r0(pl.pre.extraKcal)} kcal</span></div>`:""}
    ${nextTxt}</section>`;
  return h;
}

      ${pl.reminders&&st!=="granted"?`<div class="note err">Varsler er slått av for Makrologg i telefonens innstillinger.</div><button class="btn ghost block" data-act="notifSettings">Åpne varselinnstillinger</button>`:""}
      ${pl.reminders&&sch.length?`<div class="note num">I dag: ${sch.map(x=>`${meal(x.meal)} ${hhmm(x.at)}`).join(" · ")}</div>`:""}`;
  } else h+=`<div class="note">Påminnelser krever den nyeste versjonen av appen. Trykk «Oppdater» i det grønne feltet på dagssiden.</div>`;
  h+=`</section>`;
  return h;
}

function macroPreview(v){ return `<div class="preview num"><div><b>${r0(v.kcal)}</b><span>kcal</span></div><div><b style="color:var(--prot)">${fmt1(v.p)}</b><span>protein</span></div><div><b style="color:var(--carb)">${fmt1(v.c)}</b><span>karbo</span></div><div><b style="color:var(--fat)">${fmt1(v.f)}</b><span>fett</span></div></div>`; }

function sheetSlot(s){

  if(es.length) h+=`<div class="note">Du har allerede logget ${es.length} ting her (${r0(es.reduce((a,e)=>a+e.kcal,0))} kcal).</div>`;

function viewHist(){
  const g=goals(), t=todayKey(), days=[];
  for(let i=13;i>=0;i--){ const k=addDays(t,-i); const d=S.docs["day-"+k]; days.push({k,t:d?totals(d):null}); }
  const logged=days.filter(x=>x.t&&x.t.kcal>0);
  const avg = k => logged.length? logged.reduce((a,x)=>a+x.t[k],0)/logged.length : 0;
  const W=340,H=170,pl=34,pb=22,pt=10, max=Math.max(g.kcal*1.25, ...days.map(x=>x.t?x.t.kcal:0));
  const bw=(W-pl-6)/14, y=v=>pt+(H-pt-pb)*(1-v/max);
  let bars="", labels="";
  days.forEach((x,i)=>{ const v=x.t?x.t.kcal:0, X=pl+i*bw+3;
    if(v>0) bars+=`<rect x="${X}" y="${y(v)}" width="${bw-6}" height="${y(0)-y(v)}" rx="3" fill="${v>g.kcal*1.05?"var(--over)":"var(--kcal)"}"/>`;
    if(i%2===1||i===13){ const d=parseKey(x.k); labels+=`<text x="${X+(bw-6)/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.getDate()}.${d.getMonth()+1}</text>`; } });
  const ticks=[0,Math.round(max/2/100)*100,Math.round(max*0.95/100)*100].map(v=>`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v}</text>`).join("");
  const goalLine=`<line x1="${pl}" x2="${W}" y1="${y(g.kcal)}" y2="${y(g.kcal)}" stroke="var(--fg)" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/><text x="${W}" y="${y(g.kcal)-4}" text-anchor="end" font-size="9" fill="var(--fg)">mål ${r0(g.kcal)}</text>`;
  let h=`<div class="sect">Siste 14 dager</div><section class="card hist">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorier per dag siste 14 dager">${ticks}${goalLine}${bars}${labels}</svg></section>
    <section class="card"><div class="note" style="margin-bottom:10px">Snitt per loggført dag (${logged.length} dager)</div>
    <div class="statrow num"><div><b>${r0(avg("kcal"))}</b><span>kcal</span></div><div><b style="color:var(--prot)">${r0(avg("p"))}</b><span>protein g</span></div><div><b style="color:var(--carb)">${r0(avg("c"))}</b><span>karbo g</span></div><div><b style="color:var(--fat)">${r0(avg("f"))}</b><span>fett g</span></div></div></section>`;
  const prods=Object.values(foodsDoc().items||{}).sort((a,b)=>a.name.localeCompare(b.name,"nb"));
  h+=`<div class="sect">Mine matvarer (${prods.length})</div>`;
  h+= prods.length? `<div class="list">${prods.map(p=>`<button data-act="editProduct" data-v="${p.id}"><span class="nm">${esc(p.name)}${p.barcode?`<br><small class="num">${esc(p.barcode)}</small>`:""}</span><small class="num">${r0(p.per.kcal)} kcal/100 g</small></button>`).join("")}</div>`
    : `<section class="card note">Varer du skanner eller legger inn selv havner her, så du finner dem raskt neste gang.</section>`;
  return h;
}

    const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");

  }
  const lastW = ws.length? ws[ws.length-1][1] : prof.weight||"";
  return `<div class="sect">Daglige mål</div><section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="grid2"><div class="field"><label for="gk">Kalorier (kcal)</label><input class="inp num" id="gk" inputmode="numeric" value="${r0(g.kcal)}"></div>
    <div class="field"><label for="gp">Protein (g)</label><input class="inp num" id="gp" inputmode="numeric" value="${r0(g.p)}"></div>
    <div class="field"><label for="gc">Karbohydrater (g)</label><input class="inp num" id="gc" inputmode="numeric" value="${r0(g.c)}"></div>
    <div class="field"><label for="gf">Fett (g)</label><input class="inp num" id="gf" inputmode="numeric" value="${r0(g.f)}"></div>
    <div class="field"><label for="gw">Vann (glass)</label><input class="inp num" id="gw" inputmode="numeric" value="${r0(g.water)}"></div></div>
    <div class="note" id="gsum"></div>
    <button class="btn primary block" data-act="saveGoals">Lagre mål</button></section>

    <div class="sect">Regn ut mål</div><section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="seg" id="sexSeg"><button data-act="sex" data-v="m" class="${prof.sex!=="k"?"on":""}">Mann</button><button data-act="sex" data-v="k" class="${prof.sex==="k"?"on":""}">Kvinne</button></div>
    <div class="grid2"><div class="field"><label for="ca">Alder</label><input class="inp num" id="ca" inputmode="numeric" value="${prof.age||""}" placeholder="30"></div>
    <div class="field"><label for="ch">Høyde (cm)</label><input class="inp num" id="ch" inputmode="numeric" value="${prof.height||""}" placeholder="180"></div>
    <div class="field"><label for="cw">Vekt (kg)</label><input class="inp num" id="cw" inputmode="decimal" value="${prof.weight||lastW||""}" placeholder="80"></div>
    <div class="field"><label for="cact">Aktivitet</label><select class="inp" id="cact">
      ${[["1.2","Stillesittende"],["1.375","Litt aktiv (1–3 økter/uke)"],["1.55","Aktiv (3–5 økter/uke)"],["1.725","Svært aktiv (6–7 økter/uke)"],["1.9","Hardt fysisk arbeid + trening"]].map(([v,l])=>`<option value="${v}" ${String(prof.act||"1.55")===v?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <div class="field"><label for="cgoal">Målsetting</label><select class="inp" id="cgoal">
      ${[["-1000","Gå raskt ned (ca. 1 kg/uke)"],["-500","Gå ned i vekt (ca. 0,5 kg/uke)"],["-250","Gå rolig ned"],["0","Holde vekten"],["250","Bygge muskler (rolig opp)"]].map(([v,l])=>`<option value="${v}" ${String(prof.goal??"0")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <button class="btn block" data-act="calc">Regn ut og fyll inn</button>
    <div class="note">Bruker Mifflin–St Jeor-formelen. Protein settes til ca. 1,8–2,2 g per kg, fett til 25–30 % av kaloriene og resten karbohydrater.</div></section>

    <div class="sect">Vekt</div><section class="card">
    <div class="row"><input class="inp num" id="wIn" inputmode="decimal" placeholder="kg" style="flex:1;min-width:0" value=""><button class="btn primary" data-act="logWeight">Logg i dag</button></div>
    ${ws.length?`<div class="note num" style="margin-top:8px">Siste: ${fmt1(ws[ws.length-1][1])} kg (${dateLabel(ws[ws.length-1][0])})${ws.length>1?` · endring ${(ws[ws.length-1][1]-ws[0][1]>0?"+":"")+fmt1(ws[ws.length-1][1]-ws[0][1])} kg siden ${dateLabel(ws[0][0])}`:""}</div>`:`<div class="note" style="margin-top:8px">Logg vekten en gang i uka, gjerne om morgenen.</div>`}
    ${wchart}</section>

    <div class="note">Kassalapp har næringsinnhold for varene i norske dagligvarebutikker. Lag en gratis konto på kassal.app, gå til API under profilen din, lag en nøkkel og lim den inn her.</div>
    <div class="field"><label for="kKey">Kassalapp API-nøkkel</label><input class="inp" id="kKey" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(kassalKey())}" placeholder="Lim inn nøkkelen"></div>

    <button class="btn ghost block" data-act="importData">Gjenopprett fra backup</button></section>
    <div class="sect">Om appen</div><section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="note num">Versjon ${esc(window.Android&&Android.appVersion?Android.appVersion():"nett")} · innhold ${esc((document.querySelector('meta[name="web-version"]')||{}).content||"")}</div>
    ${UPD.info?updateBanner():`<button class="btn ghost block" data-act="checkUpdates">Se etter oppdateringer</button>`}</section>`;
}

/* ---------- sheets ---------- */
function openSheet(s){ UI.sheet=s; renderSheet(); }
function closeSheet(){
  if(UI.addTarget==="tpl" && UI.sheet && UI.sheet.type!=="tpl"){ openSheet({type:"tpl"}); return; }
  UI.sheet=null; UI.addTarget=null; UI.tplDraft=null; renderSheet(); }
function renderSheet(){
  const root=$("#sheetRoot"), s=UI.sheet;
  if(!s){ root.innerHTML=""; return; }
  const keepFocus=document.activeElement&&document.activeElement.id, selStart=document.activeElement&&document.activeElement.selectionStart;
  const sb=root.querySelector(".sb"), scroll=sb?sb.scrollTop:0;
  let title="", body="";
  if(s.type==="pick"){ title=s.meal==="tpl"?"Legg til i fast måltid":"Legg til i "+meal(s.meal).toLowerCase(); body=sheetPick(s); }
  else if(s.type==="slot"){ title=meal(s.slot)+(s.at?" kl "+hhmm(s.at):""); body=sheetSlot(s); }
  else if(s.type==="tpl"){ title=UI.tplDraft.id&&tplById(UI.tplDraft.id)?"Endre fast måltid":"Nytt fast måltid"; body=sheetTpl(); }
  else if(s.type==="amount"){ title=s.entryId?"Endre":"Mengde"; body=sheetAmount(s); }
  else if(s.type==="product"){ title=s.id?"Endre matvare":"Ny matvare"; body=sheetProduct(s); }
  else if(s.type==="scan"){ title="Strekkode"; body=sheetScan(s); }
  else if(s.type==="estimate"){ title="Beskriv måltidet"; body=sheetEstimate(s); }
  root.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Lukk">×</button></div><div class="sb">${body}</div></div>`;
  const nsb=root.querySelector(".sb"); if(nsb) nsb.scrollTop=scroll;
  if(keepFocus){ const el=document.getElementById(keepFocus); if(el){ el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart,selStart);}catch(e){} } }
  updateAmountPreview(); updateGoalSum();
}

function allFoods(){
  const mine=Object.values(foodsDoc().items||{});
  return mine.concat(BASE);
}
function recentFoods(){
  const seen=new Set(), out=[];
  const ks=Object.keys(S.docs).filter(k=>k.startsWith("day-")).sort().reverse();
  for(const k of ks){ for(const e of (S.docs[k].entries||[]).slice().reverse()){ const key=e.name.toLowerCase(); if(seen.has(key)||!e.per) continue; seen.add(key); out.push({id:e.foodId||"r"+out.length,name:e.name,per:e.per,portion:e.portion||null,lastG:e.g}); if(out.length>=12) return out; } }
  return out;
}
function foodRow(f,act){ return `<button data-act="${act}" data-v="${esc(f.id)}"><span class="nm">${esc(f.name)}${f.base?"":'<span class="tag">min</span>'}<br><small class="num">${r0(f.per.kcal)} kcal · P ${fmt1(f.per.p)} · K ${fmt1(f.per.c)} · F ${fmt1(f.per.f)} per 100 g</small></span></button>`; }

function sheetPick(s){
  const q=(s.q||"").trim().toLowerCase();
  let list;
  if(q){ list=allFoods().filter(f=>f.name.toLowerCase().includes(q)||(f.barcode||"").includes(q)).slice(0,40); }
  const ai=!!SAMPLE && s.meal!=="tpl";
  let h=`<div class="tools">
    <button class="tool" data-act="scan">${ICON.scan}<span>Skann strekkode<small>Henter næringsinnhold</small></span></button>
    ${ai?`<button class="tool" data-act="labelPhoto">${ICON.label}<span>Les etikett<small>Claude leser næringsinnhold</small></span></button>`:""}
    ${ai?`<button class="tool" data-act="estimate">${ICON.spark}<span>Beskriv måltid<small>Tekst eller bilde, Claude anslår</small></span></button>`:""}
    <button class="tool" data-act="newProduct">${ICON.pen}<span>Ny matvare<small>Fyll inn selv</small></span></button></div>
    <input class="inp" id="q" type="search" placeholder="Søk i matvarer" value="${esc(s.q||"")}" autocomplete="off">`;
  if(q){ h+= list.length?`<div class="list">${list.map(f=>foodRow(f,"pickFood")).join("")}</div>`:`<div class="note">Ingen treff blant dine og de vanlige matvarene.</div>`;
    if(s.offQ===q && s.offBusy) h+=`<div class="busy"><div class="spin"></div>Søker i Open Food Facts …</div>`;
    else if(s.offQ===q && s.offRes) h+= s.offRes.length?`<div class="sect">Open Food Facts</div><div class="list">${s.offRes.map((f,i)=>`<button data-act="pickOff" data-v="${i}"><span class="nm">${esc(f.name)}<br><small class="num">${r0(f.per.kcal)} kcal · P ${fmt1(f.per.p)} · K ${fmt1(f.per.c)} · F ${fmt1(f.per.f)} per 100 g</small></span></button>`).join("")}</div>`:`<div class="note">Ingen treff i Open Food Facts heller.</div>`;
    else if(s.offQ===q && s.offErr) h+=`<div class="note err">Fikk ikke kontakt med Open Food Facts. Sjekk nettet.</div>`;
    else h+=`<button class="btn ghost block" data-act="offSearch">Søk etter «${esc(s.q)}» i Open Food Facts</button>`;
    h+=`<button class="btn ghost block" data-act="newProduct" data-name="${esc(s.q)}">Legg inn «${esc(s.q)}» selv</button>`; }
  else { const tpls=Object.values(mealsDoc().items||{});
    if(tpls.length && s.meal!=="tpl") h+=`<div class="sect">Faste måltider</div><div class="list">${tpls.map(t=>`<button data-act="logTpl" data-v="${t.id}"><span class="nm">${esc(t.name)}<br><small class="num">${t.items.length} ting · ${r0(tplTotals(t).kcal)} kcal</small></span></button>`).join("")}</div>`;
    const rec=recentFoods(); if(rec.length) h+=`<div class="sect">Nylig brukt</div><div class="list">${rec.map(f=>foodRow(f,"pickRecent")).join("")}</div>`;
    h+=`<div class="sect">Vanlige matvarer</div><div class="list">${BASE.slice(0,15).map(f=>foodRow(f,"pickFood")).join("")}</div>`; }
  return h;
}

function sheetAmount(s){
  const f=s.food;
  const portions=[];
  if(f.portion) portions.push(f.portion);
  portions.push({label:"100 g",g:100});
  if(s.lastG && !portions.some(p=>p.g===s.lastG)) portions.unshift({label:"Sist: "+r0(s.lastG)+" g",g:s.lastG});
  return `<div><div style="font-weight:600;font-size:17px">${esc(f.name)}</div><div class="note num">${r0(f.per.kcal)} kcal · P ${fmt1(f.per.p)} · K ${fmt1(f.per.c)} · F ${fmt1(f.per.f)} per 100 g</div></div>
   <div class="row">${portions.map(p=>`<button class="chip" data-act="portion" data-v="${p.g}">${esc(p.label)}${p.label.includes(" g")?"":` · ${r0(p.g)} g`}</button>`).join("")}</div>
   <div class="grid2"><div class="field"><label for="amtG">Mengde (gram)</label><input class="inp num" id="amtG" inputmode="decimal" value="${s.g??""}"></div>
   ${s.meal==="tpl"?"":`<div class="field"><label for="amtMeal">Måltid</label><select class="inp" id="amtMeal">${MEALS.map(([k,l])=>`<option value="${k}" ${s.meal===k?"selected":""}>${l}</option>`).join("")}</select></div>`}</div>
   <div class="preview num" id="amtPrev"></div>
   <button class="btn primary block" data-act="saveAmount">${s.meal==="tpl"?(s.tplIndex!=null?"Lagre endring":"Legg til i måltidet"):s.entryId?"Lagre endring":"Legg til"}</button>

   ${f.id&&!f.base&&foodsDoc().items&&foodsDoc().items[f.id]?`<button class="btn ghost block" data-act="editProduct" data-v="${esc(f.id)}">Feil vare eller verdier? Endre varen</button>`:""}`;
}
function updateAmountPreview(){

}

function sheetProduct(s){
  const p=s.p||{};
  return `${s.img?`<img class="thumb" src="${s.img}" alt="Bilde av etiketten">`:""}
   ${s.busy?`<div class="busy"><div class="spin"></div>${esc(s.busy)}</div>`:""}

   <div class="field"><label for="pn">Navn</label><input class="inp" id="pn" value="${esc(p.name||"")}" placeholder="F.eks. Tine Skyr vanilje"></div>

     <input class="inp num" id="pk" inputmode="decimal" aria-label="Kalorier per 100 g" value="${p.kcal??""}" placeholder="kcal">
     <input class="inp num" id="pp" inputmode="decimal" aria-label="Protein per 100 g" value="${p.p??""}" placeholder="P">

/* ---------- barcode ---------- */
async function decodeBarcode(file){
  const url=URL.createObjectURL(file);
  try{
    if("BarcodeDetector" in window){
      try{ const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
        const bmp=await createImageBitmap(file); const r=await det.detect(bmp); if(r&&r.length) return r[0].rawValue; }catch(e){}
    }
    if(window.ZXing){
      try{ const hints=new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
        const reader=new ZXing.BrowserMultiFormatReader(hints); const res=await reader.decodeFromImageUrl(url); if(res) return res.getText(); }catch(e){}
    }
    // retry on a downscaled, grayscale copy (large phone photos often fail)
    if(window.ZXing){
      try{ const img=await createImageBitmap(file); const sc=Math.min(1,1400/Math.max(img.width,img.height));
        const cv=document.createElement("canvas"); cv.width=img.width*sc; cv.height=img.height*sc; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const reader=new ZXing.BrowserMultiFormatReader(); const res=await reader.decodeFromImageUrl(cv.toDataURL("image/jpeg",.9)); if(res) return res.getText(); }catch(e){}
    }
    if(SAMPLE){
      try{ const r=await SAMPLE.json('Les tallene under strekkoden (EAN/UPC) på bildet. Svar KUN med JSON: {"barcode":"<bare sifre>"} eller {"barcode":null} hvis du ikke ser noen.',{images:[await shrink(file)],modelTier:"quick"});
        if(r&&r.barcode&&/^\d{6,14}$/.test(String(r.barcode))) return String(r.barcode); }catch(e){ if(e&&e.code==="not_granted") throw e; }
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
async function shrink(file,max=1400){
  try{ const img=await createImageBitmap(file); const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.85)); }catch(e){ return file; }
}
const fileToURL = f => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
function findByBarcode(code){ return Object.values(foodsDoc().items||{}).find(p=>p.barcode===code); }
function handleCode(code){
  const s=UI.sheet; code=String(code).replace(/\D/g,"");
  if(!code){ s.msg="Skriv inn tallene under strekkoden."; s.err=true; renderSheet(); return; }
  s.cand=null; s.offline=null;

  if(p){ openAmount(p, s.meal); toast("Fant "+p.name); return; }
  s.busy="Slår opp "+code+" …"; s.msg=""; s.err=false; renderSheet();
  lookupBarcode(code).then(r=>{
    if(UI.sheet!==s) return;
    s.busy="";
    if(r.per){ s.cand=r; renderSheet(); return; }
    const why = r.name ? `Fant «${r.name}», men uten næringsverdier.` : "Fant ikke varen.";
    openSheet({type:"product", meal:s.meal, p:{barcode:code,name:r.name||""}, msg:`${why} Fyll inn verdiene fra etiketten (per 100 g), så husker appen varen neste gang.`});
  }).catch(()=>{ if(UI.sheet!==s) return; s.busy=""; s.msg="Fikk ikke kontakt med databasene. Sjekk nettet, eller legg inn varen selv."; s.err=true; s.offline=code; renderSheet(); });
}
/* lookup order: Kassalapp (if key) -> Open Food Facts. Returns {per,...} or {name} or {} */
async function lookupBarcode(code){
  let name="", image="", errors=0, tried=0;
  const key=kassalKey();
  if(key){ tried++;
    try{ const k=await kassalLookup(code,key); if(k&&k.per) return k; if(k&&k.name){ name=k.name; image=k.image||""; } }catch(e){ errors++; } }
  tried++;
  try{ const o=await offLookup(code);
    if(o&&o.per){ if(name){ o.name=name; o.source="Kassalapp og Open Food Facts"; if(image) o.image=image; } return o; }
    if(o&&o.name&&!name) name=o.name;
  }catch(e){ errors++; }
  if(errors===tried) throw new Error("offline");
  return {name};
}

/* native HTTP (no CORS limits) with plain fetch as fallback */
const NF={n:0,cb:{}};
window.onNativeFetch=(id,status,body)=>{ const f=NF.cb[id]; delete NF.cb[id]; if(f) f(status,body); };
function httpJson(url, headers={}){
  if(window.Android&&Android.fetchText){
    return new Promise((res,rej)=>{ const id=String(++NF.n); const t=setTimeout(()=>{ delete NF.cb[id]; rej(new Error("timeout")); },15000);
      NF.cb[id]=(st,body)=>{ clearTimeout(t); if(st===0) return rej(new Error("net")); try{ res({status:st,json:body?JSON.parse(body):null}); }catch(e){ res({status:st,json:null}); } };
      Android.fetchText(id,url,JSON.stringify(headers)); });
  }
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  return fetch(url,{headers,signal:ctl.signal}).then(async r=>({status:r.status,json:await r.json().catch(()=>null)})).finally(()=>clearTimeout(t));
}

/* ---------- Kassalapp ---------- */
const kassalKey = () => ((S.docs.profile||{}).settings||{}).kassalKey||"";
async function kassalLookup(code,key){
  const r=await httpJson(`https://kassal.app/api/v1/products/ean/${encodeURIComponent(code)}`,{Authorization:"Bearer "+key,Accept:"application/json"});
  if(r.status===401||r.status===403){ toast("Kassalapp-nøkkelen ble avvist. Sjekk den under «Mål og vekt»."); throw new Error("auth"); }
  if(r.status===404) return null;
  if(r.status!==200||!r.json||!r.json.data) throw new Error("http "+r.status);
  const d=r.json.data, prods=d.products||[], p=prods.find(x=>x&&x.name)||{};
  const brand=p.brand||p.vendor||"";
  const name=[p.name||"", brand && !(p.name||"").toLowerCase().includes(brand.toLowerCase()) ? brand : ""].filter(Boolean).join(" – ");
  const image=(prods.find(x=>x&&x.image)||{}).image||"";
  const nut={}; (d.nutrition||[]).forEach(n=>{ if(n&&n.code) nut[n.code]=Number(n.amount); });
  let kcal=nut.energi_kcal; if(!isFinite(kcal)&&isFinite(nut.energi_kj)) kcal=nut.energi_kj/4.184;
  if(!isFinite(kcal)) return {name,image};
  return {name:name||("Vare "+code),image,source:"Kassalapp",barcode:code,
    per:{kcal:kcal||0,p:nut.protein||0,f:nut.fett_totalt||0,c:nut.karbohydrater||0},portion:null};
}

/* ---------- Open Food Facts ---------- */
const OFF_FIELDS="code,product_name,product_name_nb,product_name_no,product_name_en,generic_name,brands,quantity,nutriments,serving_quantity,serving_size,image_front_small_url";
function offToProduct(p, code){
  const n=p.nutriments||{};
  let kcal=n["energy-kcal_100g"];
  if(kcal==null && n["energy_100g"]!=null) kcal=n["energy_100g"]/4.184;
  if(kcal==null) return null;
  const base=p.product_name_nb||p.product_name_no||p.product_name||p.product_name_en||p.generic_name||"";
  const brands=p.brands?String(p.brands).split(",").map(x=>x.trim()).filter(Boolean):[];
  const brand=brands.find(b=>!base.toLowerCase().includes(b.toLowerCase()))||"";
  const name=[base||brands.join(" "), base?brand:"", p.quantity||""].filter(Boolean).join(" – ")||("Vare "+code);
  const sq=Number(p.serving_quantity);
  return {name, per:{kcal:Number(kcal)||0,p:Number(n.proteins_100g)||0,f:Number(n.fat_100g)||0,c:Number(n.carbohydrates_100g)||0},
    portion: sq>0?{label:p.serving_size?String(p.serving_size).slice(0,24):"1 porsjon",g:sq}:null, barcode:code||p.code||null,
    source:"Open Food Facts", image:p.image_front_small_url||""};
}
async function offLookup(code){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{ const r=await httpJson(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
    if(r.status===404) return {missing:true}; if(r.status!==200||!r.json) throw new Error("http"); const j=r.json; if(j.status!==1||!j.product) return {missing:true};
    return offToProduct(j.product,code)||{noNutrition:true,name:j.product.product_name||""};
  } finally { clearTimeout(t); }
}
async function offSearch(q){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
  try{ const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&json=1&page_size=25&fields=${OFF_FIELDS}`,{signal:ctl.signal});
    const j=await r.json(); return (j.products||[]).map(p=>offToProduct(p,p.code)).filter(Boolean);
  } finally { clearTimeout(t); }
}

    const per=e.per||{kcal:e.kcal/e.g*100,p:e.p/e.g*100,f:e.f/e.g*100,c:e.c/e.g*100};
    openAmount({id:e.foodId,name:e.name,per,portion:e.portion,base:!e.foodId}, e.meal, {g:e.g, entryId:e.id, est:e.est}); }
  else if(a==="deleteEntry"){ const s=UI.sheet, d=clone(dayDoc(UI.date)); d.entries=(d.entries||[]).filter(x=>x.id!==s.entryId); writeDoc("day-"+UI.date,d); closeSheet(); toast("Slettet"); }
  else if(a==="newProduct"){ openSheet({type:"product",meal:UI.sheet?UI.sheet.meal:null,p:{name:t.dataset.name||""}}); }
  else if(a==="editProduct"){ const p=foodsDoc().items[v]; if(p) openSheet({type:"product",id:p.id,p:{name:p.name,kcal:p.per.kcal,p:p.per.p,c:p.per.c,f:p.per.f,porLabel:p.portion?.label||"",porG:p.portion?.g??"",barcode:p.barcode||""}}); }
  else if(a==="saveProduct"){
    const s=UI.sheet, f=readProductForm();
    if(!f.name){ s.p=f; s.msg="Gi matvaren et navn."; s.err=true; renderSheet(); return; }
    if($("#pk").value===""){ s.p=f; s.msg="Fyll inn i det minste kalorier per 100 g."; s.err=true; renderSheet(); return; }
    const fd=clone(foodsDoc()); fd.kind="foods"; fd.items=fd.items||{};
    let id=s.id; if(!id && f.barcode){ const ex=findByBarcode(f.barcode); if(ex) id=ex.id; } id=id||"p"+uid();
    const prod={id,name:f.name,per:{kcal:numIn(f.kcal),p:numIn(f.p),f:numIn(f.f),c:numIn(f.c)},portion:numIn(f.porG)>0?{label:f.porLabel||"1 porsjon",g:numIn(f.porG)}:null,barcode:f.barcode||null,updated:Date.now()};
    fd.items[id]=prod; writeDoc("foods",fd);
    if(s.meal) openAmount(prod,s.meal); else { closeSheet(); toast("Lagret"); } }
  else if(a==="deleteProduct"){ const fd=clone(foodsDoc()); delete fd.items[UI.sheet.id]; writeDoc("foods",fd); closeSheet(); toast("Matvaren er slettet"); }
  else if(a==="scan"){ openSheet({type:"scan",meal:UI.sheet?UI.sheet.meal:guessMeal()}); startScan(); }
  else if(a==="scanPhoto"){ UI.sheet.code=""; UI.sheet.msg=""; UI.sheet.offline=null; renderSheet(); startScan(); }
  else if(a==="candOk"){ const prod=saveProduct(UI.sheet.cand); openAmount(prod, UI.sheet.meal); }
  else if(a==="candEdit"){ const c=UI.sheet.cand; openSheet({type:"product",meal:UI.sheet.meal,p:{name:c.name,kcal:r1(c.per.kcal),p:r1(c.per.p),c:r1(c.per.c),f:r1(c.per.f),porLabel:c.portion?.label||"",porG:c.portion?.g??"",barcode:c.barcode||""},msg:"Rett opp etter etiketten og lagre."}); }
  else if(a==="candWrong"){ const c=UI.sheet.cand; openSheet({type:"product",meal:UI.sheet.meal,p:{barcode:c.barcode||UI.sheet.code||""},msg:"Fyll inn navn og verdier fra etiketten (per 100 g). Appen husker varen neste gang du skanner den."}); }
  else if(a==="saveKey"){ const pr=clone(S.docs.profile||{kind:"profile"}); pr.kind="profile"; pr.settings=Object.assign({},pr.settings,{kassalKey:$("#kKey").value.trim()}); writeDoc("profile",pr); toast(pr.settings.kassalKey?"Nøkkelen er lagret":"Nøkkelen er fjernet"); }
  else if(a==="newFromCode"){ openSheet({type:"product",meal:UI.sheet.meal,p:{barcode:UI.sheet.offline}}); }
  else if(a==="offSearch"){ const s=UI.sheet, q=(s.q||"").trim().toLowerCase(); s.offQ=q; s.offBusy=true; s.offRes=null; s.offErr=false; renderSheet();
    offSearch(q).then(r=>{ s.offRes=r; }).catch(()=>{ s.offErr=true; }).finally(()=>{ s.offBusy=false; if(UI.sheet===s) renderSheet(); }); }
  else if(a==="pickOff"){ const f=UI.sheet.offRes[Number(v)]; if(f){ const prod=saveProduct(f); openAmount(prod, UI.sheet.meal); } }
  else if(a==="wakeNow"){ setWake(Math.round(Date.now()/300000)*300000); }
  else if(a==="wakeAt"){ setWake(wakeFromClock(v)); }
  else if(a==="wakeSet"){ const val=$("#wakeIn").value; if(!val){ toast("Velg et klokkeslett"); return; } setWake(wakeFromClock(val)); }
  else if(a==="wakeEdit"){ UI.wakeEdit=true; render(); }
  else if(a==="wakeCancel"){ UI.wakeEdit=false; render(); }
  else if(a==="logSlotTpl"){ const sl=daySchedule(UI.date).find(x=>x.meal===v), tp=sl&&tplById(sl.tpl); if(tp){ logTemplate(UI.date,v,tp,false); toast(`${tp.name} er logget`); } }
  else if(a==="logTpl"){ const tp=tplById(v); if(tp){ const mk=UI.sheet.meal; UI.sheet=null; UI.addTarget=null; renderSheet(); logTemplate(UI.date,mk,tp,false); toast(`${tp.name} er logget`); } }
  else if(a==="slotLog"){ const s=UI.sheet, tp=tplById(s.tpl), w=$("#slotWater").checked; UI.date=s.day; closeSheet(); logTemplate(s.day,s.slot,tp,w); toast(`${tp.name} er logget${w?", pluss ett glass vann":""}`); }
  else if(a==="slotOther"){ const s=UI.sheet; UI.date=s.day; openSheet({type:"pick",meal:s.slot,q:""}); }
  else if(a==="slotWaterOnly"){ const s=UI.sheet, d=clone(dayDoc(s.day)); d.kind="day"; d.date=s.day; d.water=(d.water||0)+1; closeSheet(); writeDoc("day-"+s.day,d); toast("Ett glass vann er logget"); }
  else if(a==="newTpl"){ UI.tplDraft={id:"",name:"",items:[]}; openSheet({type:"tpl"}); }
  else if(a==="editTpl"){ const tp=tplById(v); if(tp){ UI.tplDraft=clone(tp); UI.tplDraft.items=UI.tplDraft.items||[]; openSheet({type:"tpl"}); } }
  else if(a==="saveAsTpl"){ const es=(dayDoc(UI.date).entries||[]).filter(e=>e.meal===v);
    UI.tplDraft={id:"",name:"Min "+meal(v).toLowerCase(),items:es.map(e=>({name:e.name,g:e.g,per:e.per||{kcal:e.kcal/e.g*100,p:e.p/e.g*100,f:e.f/e.g*100,c:e.c/e.g*100},portion:e.portion||null,foodId:e.foodId||null}))};
    openSheet({type:"tpl"}); }
  else if(a==="tplAdd"){ UI.tplDraft.name=$("#tplName").value; UI.addTarget="tpl"; openSheet({type:"pick",meal:"tpl",q:""}); }
  else if(a==="tplItem"){ const i=UI.tplDraft.items[Number(v)]; UI.tplDraft.name=$("#tplName").value; UI.addTarget="tpl";
    openAmount({id:i.foodId,name:i.name,per:i.per,portion:i.portion,base:!i.foodId},"tpl",{g:i.g,tplIndex:Number(v)}); }
  else if(a==="tplDel"){ UI.tplDraft.name=$("#tplName").value; UI.tplDraft.items.splice(Number(v),1); renderSheet(); }
  else if(a==="tplSave"){ const t=UI.tplDraft; t.name=$("#tplName").value.trim();
    if(!t.name){ toast("Gi måltidet et navn"); return; } if(!t.items.length){ toast("Legg til minst én matvare"); return; }
    const md=clone(mealsDoc()); md.kind="meals"; md.items=md.items||{}; const id=t.id||"m"+uid();
    md.items[id]={id,name:t.name,items:t.items}; UI.addTarget=null; UI.tplDraft=null; UI.sheet=null; renderSheet(); writeDoc("meals",md); toast("Fast måltid lagret"); }
  else if(a==="tplRemove"){ const md=clone(mealsDoc()); delete md.items[UI.tplDraft.id]; UI.addTarget=null; UI.tplDraft=null; UI.sheet=null; renderSheet(); writeDoc("meals",md); toast("Fast måltid slettet"); }
  else if(a==="notifSettings"){ if(window.Android&&Android.openNotifSettings) Android.openNotifSettings(); }
  else if(a==="installUpdate"){ if(window.Android&&Android.installUpdate){ UPD.status="progress"; UPD.pct=0; render(); Android.installUpdate(); } }
  else if(a==="checkUpdates"){ if(window.Android&&Android.checkUpdates){ Android.checkUpdates(); toast("Ser etter oppdateringer …"); } }
  else if(a==="exportData"){ const txt=JSON.stringify({app:"makrologg",v:1,exported:new Date().toISOString(),docs:S.docs});
    if(window.Android&&Android.share) Android.share(txt,"Makrologg-backup "+todayKey());
    else { const ta=$("#backupTxt"); ta.value=txt; ta.select(); try{ navigator.clipboard.writeText(txt); toast("Kopiert"); }catch(e){} } }
  else if(a==="importData"){ try{ const j=JSON.parse($("#backupTxt").value); if(j.app!=="makrologg"||!j.docs) throw 0;
      S.docs=j.docs; lsSave(); render(); toast("Backup gjenopprettet"); }catch(e){ toast("Teksten er ikke en gyldig backup"); } }
  else if(a==="bcLookup"){ handleCode($("#bcIn").value); }
  else if(a==="labelPhoto"){ if(UI.sheet && UI.sheet.type==="product") UI.sheet.p=readProductForm(); $("#fileLabel").click(); }
  else if(a==="estimate"){ openSheet({type:"estimate",meal:UI.sheet.meal,text:(UI.sheet.q||"")}); }
  else if(a==="mealPhoto"){ UI.sheet.text=$("#estText").value; $("#fileMeal").click(); }
  else if(a==="mealPhotoClear"){ UI.sheet.text=$("#estText").value; UI.sheet.img=null; UI.sheet.blob=null; renderSheet(); }
  else if(a==="runEstimate"){
    const s=UI.sheet; s.text=$("#estText").value.trim();
    if(!s.text && !s.blob){ s.msg="Skriv hva du spiste, eller legg til et bilde."; s.err=true; renderSheet(); return; }
    s.busy="Claude anslår …"; s.msg=""; s.items=null; renderSheet();
    try{
      const r=await SAMPLE.json(`Du er en norsk ernæringsassistent. Anslå næringsinnholdet i måltidet${s.blob?" på bildet":""}${s.text?` beskrevet slik: «${s.text}»`:""}.
Del opp i enkeltdeler (f.eks. brød, pålegg, drikke). Bruk typiske norske porsjoner og verdier (Matvaretabellen) når mengde ikke er oppgitt.
Svar KUN med JSON: {"items":[{"name":"kort norsk navn","grams":tall,"kcal":tall,"protein":tall,"carbs":tall,"fat":tall}]} der tallene gjelder hele mengden i grams.`,
        {images:s.blob?[s.blob]:undefined, modelTier:"default"});
      s.items=(r&&Array.isArray(r.items)?r.items:[]).filter(x=>x&&x.name).map(x=>({name:String(x.name),grams:Number(x.grams)||0,kcal:Number(x.kcal)||0,protein:Number(x.protein)||0,carbs:Number(x.carbs)||0,fat:Number(x.fat)||0,on:true}));
      s.busy=""; if(!s.items.length){ s.msg="Fikk ikke noe anslag. Prøv å beskrive mer konkret."; s.err=true; }
    }catch(e){ s.busy=""; s.msg=aiErr(e); s.err=true; }
    if(UI.sheet===s) renderSheet(); }
  else if(a==="addEstimate"){
    const s=UI.sheet, d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; d.entries=d.entries||[];
    const chosen=s.items.filter(x=>x.on!==false);
    chosen.forEach(x=>{ const g=x.grams>0?x.grams:100; d.entries.push({id:uid(),meal:s.meal,name:x.name,g,per:{kcal:x.kcal/g*100,p:x.protein/g*100,f:x.fat/g*100,c:x.carbs/g*100},kcal:x.kcal,p:x.protein,f:x.fat,c:x.carbs,est:true}); });
    writeDoc("day-"+UI.date,d); closeSheet(); toast(chosen.length+" ting lagt til"); }
  else if(a==="saveGoals"){
    const prof=clone(S.docs.profile||{kind:"profile"}); prof.kind="profile";
    prof.goals={kcal:numIn($("#gk").value),p:numIn($("#gp").value),c:numIn($("#gc").value),f:numIn($("#gf").value),water:Math.max(1,Math.round(numIn($("#gw").value)))};
    writeDoc("profile",prof); toast("Målene er lagret"); }
  else if(a==="sex"){ calcSex=v; document.querySelectorAll("#sexSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); }
  else if(a==="calc"){
    const prof=(S.docs.profile||{}).body||{};
    const sex=calcSex||prof.sex||"m", age=numIn($("#ca").value), h=numIn($("#ch").value), w=numIn($("#cw").value), act=numIn($("#cact").value), gl=numIn($("#cgoal").value);
    if(!age||!h||!w){ toast("Fyll inn alder, høyde og vekt"); return; }
    const bmr=10*w+6.25*h-5*age+(sex==="k"?-161:5);
    const floor = sex==="k"?1200:1500;
    let kcal=Math.round((bmr*act+gl)/10)*10;
    if(kcal<floor){ kcal=floor; setTimeout(()=>toast(`Kalorimålet er satt til ${floor} kcal, det laveste vi anbefaler.`),2600); }
    const pPer = gl<0?2.0:gl>0?1.9:1.8;
    const p=Math.round(w*pPer), f=Math.round(kcal*(gl<0?0.27:0.28)/9), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
    $("#gk").value=kcal; $("#gp").value=p; $("#gf").value=f; $("#gc").value=c; updateGoalSum();
    const pr=clone(S.docs.profile||{kind:"profile"}); pr.kind="profile"; pr.body={sex,age,height:h,weight:w,act:String(act),goal:String(gl)};
    pr.goals={kcal,p,c,f,water:goals().water}; writeDoc("profile",pr);
    toast(`Vedlikehold ca. ${Math.round(bmr*act/10)*10} kcal. Mål lagret.`); }
  else if(a==="logWeight"){ const w=numIn($("#wIn").value); if(w<20||w>400){ toast("Skriv inn vekten i kg"); return; }
    const wd=clone(weightsDoc()); wd.kind="weights"; wd.items=wd.items||{}; wd.items[todayKey()]=w; writeDoc("weights",wd); toast("Vekt logget"); }
});

document.addEventListener("input", ev=>{
  const id=ev.target.id;
  if(id==="q" && UI.sheet){ UI.sheet.q=ev.target.value; renderSheet(); }
  else if(id==="amtG"){ UI.sheet.g=ev.target.value; updateAmountPreview(); }
  else if(id==="amtMeal"){ UI.sheet.meal=ev.target.value; }
  else if(["gk","gp","gc","gf"].includes(id)) updateGoalSum();
  else if(id==="estText" && UI.sheet) UI.sheet.text=ev.target.value;
  else if(id==="tplName" && UI.tplDraft) UI.tplDraft.name=ev.target.value;
});
document.addEventListener("change", ev=>{
  if(ev.target.matches("[data-est]") && UI.sheet && UI.sheet.items){ UI.sheet.items[Number(ev.target.dataset.est)].on=ev.target.checked; }
  if(ev.target.id==="amtMeal" && UI.sheet) UI.sheet.meal=ev.target.value;
  if(ev.target.matches("[data-pl]")) savePlanForm();
  if(ev.target.id==="trainChk"){ const d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; d.train={on:ev.target.checked,time:(d.train&&d.train.time)||plan().pre.defaultTime}; writeDoc("day-"+UI.date,d);
    if(ev.target.checked) toast(`Pre-workout lagt til, +${r0(plan().pre.extraKcal)} kcal i dag`); }
  if(ev.target.id==="trainTime" && ev.target.value){ const d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; d.train={on:true,time:ev.target.value}; writeDoc("day-"+UI.date,d);
    const pr=clone(S.docs.profile||{kind:"profile"}); pr.kind="profile"; const pl=plan(); pl.pre.defaultTime=ev.target.value; pr.plan=pl; writeDoc("profile",pr); }
});
function savePlanForm(){
  const pr=clone(S.docs.profile||{kind:"profile"}); pr.kind="profile"; const pl=plan(), wasOn=pl.reminders;
  const el=id=>document.getElementById(id);
  if(el("plWake")&&el("plWake").value) pl.defaultWake=el("plWake").value;
  for(const [k] of MEALS){ if(k==="pre"||!el("plOn-"+k)) continue; pl.slots[k].on=el("plOn-"+k).checked;
    if(el("plOff-"+k)) pl.slots[k].off=Number(el("plOff-"+k).value); if(el("plTpl-"+k)) pl.slots[k].tpl=el("plTpl-"+k).value; }
  if(el("plPre")) pl.pre.before=Number(el("plPre").value);
  if(el("plExtra")) pl.pre.extraKcal=Math.max(0,Math.round(numIn(el("plExtra").value)));
  if(el("plTrain")&&el("plTrain").value) pl.pre.defaultTime=el("plTrain").value;
  if(el("plPreTpl")) pl.pre.tpl=el("plPreTpl").value;
  if(el("plRem")) pl.reminders=el("plRem").checked;
  pr.plan=pl; writeDoc("profile",pr);
  if(pl.reminders&&!wasOn&&notifState()!=="granted"&&window.Android&&Android.requestNotifPermission) Android.requestNotifPermission();
}
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && UI.sheet) closeSheet(); if(ev.key==="Enter" && ev.target.id==="bcIn") handleCode(ev.target.value); });

$("#fileBarcode").addEventListener("change", async ev=>{
  const file=ev.target.files[0]; ev.target.value=""; if(!file) return;
  if(!UI.sheet||UI.sheet.type!=="scan") openSheet({type:"scan",meal:UI.sheet?UI.sheet.meal:guessMeal()});
  const s=UI.sheet; s.img=await fileToURL(await shrink(file,900)); s.busy="Leser strekkoden …"; s.msg=""; s.err=false; renderSheet();
  try{ const code=await decodeBarcode(file); s.busy="";
    if(code){ s.code=code; handleCode(code); return; }
    s.msg="Fant ingen strekkode i bildet. Prøv igjen nærmere og med bedre lys, eller skriv inn tallene."; s.err=true;
  }catch(e){ s.busy=""; s.msg=aiErr(e); s.err=true; }
  if(UI.sheet===s) renderSheet();
});
$("#fileLabel").addEventListener("change", async ev=>{ const file=ev.target.files[0]; ev.target.value=""; if(file&&SAMPLE) readLabel(file); });
$("#fileMeal").addEventListener("change", async ev=>{ const file=ev.target.files[0]; ev.target.value=""; if(!file||!UI.sheet) return;
  UI.sheet.blob=await shrink(file); UI.sheet.img=await fileToURL(await shrink(file,900)); renderSheet(); });

render();
initStore();
</script>
</body></html>
