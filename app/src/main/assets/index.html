<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="min-native" content="2"><meta name="web-version" content="24"><title>Makrologg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — summary dial on top, meal cards, bottom tab bar, sheets slide up for adding food */
:root{
  --bg:#f4f4f4; --surface:#ffffff; --surface-2:#ebebeb; --line:#dcdcdc;
  --fg:#0a0a0a; --muted:#6b6b6b;
  --accent:#0a0a0a; --accent-fg:#ffffff; --accent-soft:#e6e6e6;
  --prot:#3a3a3a; --fat:#a8a8a8; --carb:#757575; --kcal:#0a0a0a;
  --over:#d23a2e; --ok:#4a4a4a; --bar:#b5b5b5; --warn:#b7791f;
  --shadow:0 1px 2px rgba(20,33,30,.06),0 6px 20px rgba(20,33,30,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#121212; --surface-2:#1e1e1e; --line:#2c2c2c;
  --fg:#f2f2f2; --muted:#8a8a8a;
  --accent:#ffffff; --accent-fg:#000000; --accent-soft:#2a2a2a;
  --prot:#d0d0d0; --fat:#6a6a6a; --carb:#9a9a9a; --kcal:#ffffff;
  --over:#ff5a4f; --ok:#bdbdbd; --bar:#4a4a4a; --warn:#f2b545; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121212; --surface-2:#1e1e1e; --line:#2c2c2c;
  --fg:#f2f2f2; --muted:#8a8a8a;
  --accent:#ffffff; --accent-fg:#000000; --accent-soft:#2a2a2a;
  --prot:#d0d0d0; --fat:#6a6a6a; --carb:#9a9a9a; --kcal:#ffffff;
  --over:#ff5a4f; --ok:#bdbdbd; --bar:#4a4a4a; --warn:#f2b545; --shadow:none; color-scheme:dark}
/* colour themes chosen in settings (default = monochrome above) */
:root[data-pal="lime"]{--accent:#4d6b00;--accent-fg:#ffffff;--accent-soft:#e6f2c4;--kcal:#5c8000;--prot:#2f6fd0;--carb:#8a55d0;--fat:#c98a10;--bar:#a9c46a;--ok:#2f8a4a}
:root[data-pal="is"]{--accent:#007c99;--accent-fg:#ffffff;--accent-soft:#d3eef5;--kcal:#0092b3;--prot:#4a57d6;--carb:#9a55d6;--fat:#c98a10;--bar:#86c9da;--ok:#1f9a66}
@media (prefers-color-scheme:dark){:root[data-pal="lime"]:not([data-theme="light"]){--bg:#0b0d10;--surface:#15181d;--surface-2:#1f242b;--line:#2a3038;--fg:#eef1f4;--muted:#8b95a1;--accent:#c6f432;--accent-fg:#111407;--accent-soft:#2b3411;--prot:#5aa9ff;--carb:#b58cff;--fat:#ffb547;--kcal:#c6f432;--over:#ff6b5b;--ok:#4fd18b;--bar:#7f9c26}}
:root[data-pal="lime"][data-theme="dark"]{--bg:#0b0d10;--surface:#15181d;--surface-2:#1f242b;--line:#2a3038;--fg:#eef1f4;--muted:#8b95a1;--accent:#c6f432;--accent-fg:#111407;--accent-soft:#2b3411;--prot:#5aa9ff;--carb:#b58cff;--fat:#ffb547;--kcal:#c6f432;--over:#ff6b5b;--ok:#4fd18b;--bar:#7f9c26}
@media (prefers-color-scheme:dark){:root[data-pal="is"]:not([data-theme="light"]){--bg:#070b0f;--surface:#0f161d;--surface-2:#17212b;--line:#22303d;--fg:#eaf6ff;--muted:#87a0b3;--accent:#38e1ff;--accent-fg:#00161c;--accent-soft:#0d3340;--prot:#7c8cff;--carb:#c084fc;--fat:#ffcb47;--kcal:#38e1ff;--over:#ff6b6b;--ok:#4ee6a0;--bar:#1f8aa3}}
:root[data-pal="is"][data-theme="dark"]{--bg:#070b0f;--surface:#0f161d;--surface-2:#17212b;--line:#22303d;--fg:#eaf6ff;--muted:#87a0b3;--accent:#38e1ff;--accent-fg:#00161c;--accent-soft:#0d3340;--prot:#7c8cff;--carb:#c084fc;--fat:#ffcb47;--kcal:#38e1ff;--over:#ff6b6b;--ok:#4ee6a0;--bar:#1f8aa3}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:18px;box-shadow:var(--shadow)}
.datenav .dlabel{min-width:104px;text-align:center;font-weight:600;font-size:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.summary{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.dial{position:relative;width:132px;height:132px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.dial .small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.mrow .mtop{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.mrow .mtop b{font-weight:600}
.mrow .mtop span{color:var(--muted)}
.mrow .mtop .left{color:var(--fg);font-weight:600}
.mrow .mtop .left.ov{color:var(--over)}
.msub{font-size:11px;color:var(--muted);margin-top:3px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px}
.leftrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.leftrow div{background:var(--surface-2);border-radius:12px;padding:8px 4px}
.leftrow b{display:block;font-family:var(--display);font-size:19px;line-height:1.2}
.leftrow span{font-size:11px;color:var(--muted)}
.leftrow .ov b{color:var(--over)}
.kline{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.kline b{color:var(--fg);font-weight:600}
.wline{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding-top:2px}
.wline b{color:var(--fg);font-weight:600}.wline b.good{color:var(--prot)}.wline b.bad{color:var(--over)}
.meal{padding:0}
.meal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:8px;width:100%;border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit}
.meal .mh:disabled{cursor:default}
.meal .mr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.meal.open .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.msum{padding:0 16px 2px;font-size:13px;color:var(--muted)}
.pbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:-4px;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pchip{flex-shrink:0;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;font-weight:600;font-size:14px;color:var(--fg)}
.pchip small{font-weight:500;font-size:12px;color:var(--muted)}
.pchip small.ov{color:var(--over)}
.pchip.on{border-color:var(--accent);background:var(--accent-soft)}
.pchip.add{padding:7px 14px;color:var(--accent);font-size:17px;line-height:1}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.plist .nm{display:flex;align-items:center;gap:8px}
.whos{display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:8px 8px 8px 12px}
.who .whog{width:96px;flex-shrink:0;padding:8px 10px}
.who .whog:disabled{opacity:.4}
.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow span:last-child{text-align:right}
.gear{border:0;background:var(--surface);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);box-shadow:var(--shadow);flex-shrink:0}
.gear svg{width:20px;height:20px}
.gear.on{color:var(--accent);background:var(--accent-soft)}
.hright{display:flex;align-items:center;gap:8px}
.datenav .dlabel{width:auto;min-width:92px;height:36px;border:0;background:none;box-shadow:none;color:var(--fg);font:inherit;font-weight:600;font-size:14px;padding:0 6px;border-radius:10px}
.datenav .dlabel::after{content:" ▾";color:var(--muted);font-size:11px}
.todaybtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;align-self:center}
.meal.empty{padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal.empty h3{margin:0}
.meal.empty .row{flex-wrap:nowrap}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.sm small{font-weight:500;opacity:.75;margin-left:4px}
.btn.plus{width:38px;height:38px;padding:0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mtools{display:flex;justify-content:flex-end;padding:6px 16px 0}
.link.sm{font-size:13px}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--bg);font:inherit;font-weight:800;text-decoration:underline;padding:2px 0;cursor:pointer}
.wq{display:flex;flex-direction:column;gap:10px}
.wq .seg{min-width:150px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:0 0 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.cmp .up{color:var(--ok)} .cmp .down{color:var(--over)} .cmp .same{color:var(--muted)}
.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.okline{font-size:14px;font-weight:600;color:var(--ok)}
.ptitle{font-family:var(--display);font-weight:800;font-size:24px;margin:4px 2px 0}
.qbig{font-size:17px;padding:13px 14px}
.qtools{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.qtools::-webkit-scrollbar{display:none}
.qtool{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--fg)}
.qtool svg{width:18px;height:18px;color:var(--accent)}
.mh2{display:flex;align-items:center;padding-right:12px}
.mh2 .mh{flex:1;min-width:0}
.mtools{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:flex-end;padding:6px 16px 4px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--fg)}
.stepper .cv{min-width:56px;text-align:center;font-family:var(--display);font-size:24px;font-weight:800}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.wlist{display:flex;flex-direction:column}
.wlist button{border:0;background:none;color:var(--fg);display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-top:1px solid var(--line);font:inherit;text-align:left}
.wlist button:first-child{border-top:0}
.wlist small{color:var(--muted)}
.gmhead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font:inherit;text-align:left;padding:0;cursor:pointer}
.gmhead .chev{flex-shrink:0;width:20px;height:20px}
.gmcard.open .chev{transform:rotate(180deg)}
.bkcard{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);background:transparent;box-shadow:none}
.kbal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kbal div{background:var(--surface-2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column}
.kbal b{font-family:var(--display);font-size:20px}
.kbal span{font-size:12px;color:var(--muted)}
.goalline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);color:var(--fg);border-radius:14px;padding:11px 16px;font:inherit;font-size:14px;text-align:left;margin-bottom:10px}
.goalline b{font-size:13px;white-space:nowrap}
.gbox{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px}
.gnums{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.gnums div{display:flex;flex-direction:column}
.gnums b{font-family:var(--display);font-size:20px}
.gnums span{font-size:12px;color:var(--muted)}
.mrow .mtop .left.wn,.pchip small.wn{color:var(--warn)}
.rrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.list .rrow:first-child{border-top:0}
.rrow>button:first-child{flex:1;min-width:0;border:0!important}
.rrow .plus{flex-shrink:0;margin-right:10px}
.setnav button .nm small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.backlink{margin:4px 0 0;padding-left:0;display:block;text-align:left}
.gtoggle{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--surface);color:var(--fg);border-radius:16px;padding:14px 16px;font:inherit;text-align:left}
.gtoggle small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.gtoggle .chev{width:20px;height:20px;flex-shrink:0}
.gtoggle.open .chev{transform:rotate(180deg)}
.mcfg{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mcfg:first-child{border-top:0}
.mcfg .inp{flex:1;min-width:0;padding:8px 10px}
.mcfg .mv{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:16px}
.mcfg .mv:disabled{opacity:.3}
.mcfg.hid .inp{opacity:.45}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding-bottom:2px}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:var(--surface-2);color:var(--fg);font:inherit;font-size:13px;position:relative;padding:0}
.cal button.ok{background:var(--accent);color:var(--accent-fg)}
.cal button.wn{background:var(--warn);color:#111}
.cal button.ov{background:var(--over);color:#fff}
.cal button.lo{background:transparent;border:1.5px solid var(--accent)}
.cal button.fut{opacity:.35}
.cal button.td{outline:2px solid var(--fg);outline-offset:1px}
.cal button i{position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.cal .blank{visibility:hidden}
.callg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.callg span{display:inline-flex;align-items:center;gap:5px}
.callg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.notecard textarea{width:100%;resize:vertical;min-height:54px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meal h3{margin:0;font-family:var(--display);font-weight:600;font-size:17px}
.meal .mk{font-size:13px;color:var(--muted)}
.meal ul{list-style:none;margin:0;padding:0}
.meal li{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.meal li:active{background:var(--surface-2)}
.meal li .nm{min-width:0}
.meal li .nm div{font-weight:500;overflow-wrap:anywhere}
.meal li .nm small{color:var(--muted);font-size:12px}
.meal li .kc{font-weight:600;white-space:nowrap}
.meal .mf{display:flex;gap:8px;padding:10px 16px 14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--surface-2);font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--line)}
.btn.block{width:100%;padding:13px 16px;font-size:15px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px}
.water .glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:18px;height:24px;border:2px solid var(--prot);border-top:0;border-radius:0 0 5px 5px;opacity:.35}
.glass.f{background:var(--prot);opacity:1}
.sect{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px -4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;max-width:560px;width:100%}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:8px 2px;border-radius:12px;font-weight:600;font-size:12px;white-space:nowrap;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
/* ukemeny og handleliste (innhold 22) */
.weekhd{display:flex;align-items:center;justify-content:space-between;margin-top:-6px}
.weekhd .lbl{font-weight:600;font-size:14px}
.weekhd button{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;box-shadow:var(--shadow);font-size:18px;color:var(--fg)}
.mday{padding:12px 14px 6px;display:flex;flex-direction:column}
.mday.today{outline:1.5px solid var(--accent)}
.mday .dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:6px}
.mday .dh b{font-family:var(--display);font-size:16px;font-weight:600}
.mday .dh span{font-size:12px;color:var(--muted)}
.mdish{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:9px 0;text-align:left;color:var(--fg);font:inherit;width:100%}
.mdish .nm,.mpick .nm,.mchosen .nm,.prow2 .nm,.sit .nm{display:flex;flex-direction:column;min-width:0}
.mdish .nm span,.mpick .nm span,.mchosen .nm span,.prow2 .nm span{font-weight:600;overflow-wrap:anywhere}

/* ---------- day plan ---------- */
const HOUR=3600e3;
const DEFAULT_PLAN = {defaultWake:"07:00", reminders:false,
  slots:{frokost:{on:true,off:30,tpl:""},lunsj:{on:true,off:270,tpl:""},middag:{on:true,off:540,tpl:""},kvelds:{on:true,off:780,tpl:""},snacks:{on:false,off:390,tpl:""}},
  pre:{before:90,tpl:"",extraKcal:300,defaultTime:"17:00"}};
function plan(){ const p=(S.docs[pk("profile")]||{}).plan||{}, out=clone(DEFAULT_PLAN);
  if(p.defaultWake) out.defaultWake=p.defaultWake; if(p.reminders!=null) out.reminders=!!p.reminders;
  for(const k in out.slots) Object.assign(out.slots[k], (p.slots||{})[k]||{});
  Object.assign(out.pre, p.pre||{}); return out; }
const mealsDoc = () => S.docs.meals || {kind:"meals",items:{}};
const hhmm = ts => { const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
function clockOn(k,t){ const [h,m]=String(t||"07:00").split(":").map(Number); const d=parseKey(k); d.setHours(h||0,m||0,0,0); return d.getTime(); }
function wakeTs(k){ const d=dayDoc(k); return d.wake&&d.wake.at ? d.wake.at : clockOn(k, plan().defaultWake); }
const isTraining = k => !!(dayDoc(k).train&&dayDoc(k).train.on);
function trainTs(k){ const d=dayDoc(k), w=wakeTs(k); let t=clockOn(k,(d.train&&d.train.time)||plan().pre.defaultTime); while(t<w-HOUR) t+=24*HOUR; return t; }
function daySchedule(k){
  const pl=plan(), w=wakeTs(k), out=[];
  for(const [mk] of MEALS){ const sl=pl.slots[mk]; if(sl&&sl.on) out.push({meal:mk,at:w+sl.off*60000,tpl:sl.tpl}); }
  if(isTraining(k)){ const tt=trainTs(k); out.push({meal:"pre",at:tt-pl.pre.before*60000,tpl:pl.pre.tpl,train:tt}); }
  return out.sort((a,b)=>a.at-b.at);
}
function trainExtra(k){ const t=dayDoc(k).train||{}; return t.extra!=null ? Number(t.extra)||0 : Number(plan().pre.extraKcal)||0; }
function goalsFor(k){ const g=goals(); if(isTraining(k)){ const x=trainExtra(k); g.kcal+=x; g.c+=x/4; g.extra=x; } return g; }
const tplTotals = t => (t.items||[]).reduce((a,i)=>{ const v=calc(i.per,i.g); a.kcal+=v.kcal;a.p+=v.p;a.f+=v.f;a.c+=v.c; return a; },{kcal:0,p:0,f:0,c:0});
const tplById = id => id ? (mealsDoc().items||{})[id] : null;
function fmtDur(ms){ const m=Math.round(Math.abs(ms)/60000), h=Math.floor(m/60), r=m%60; return h?`${h} t${r?` ${r} min`:""}`:`${r} min`; }
const hasMeal = (d,mk) => (d.entries||[]).some(e=>e.meal===mk);
function nextSlot(k){ if(k!==todayKey()) return null; const d=dayDoc(k), now=Date.now();
  return daySchedule(k).find(x=>!hasMeal(d,x.meal) && x.at>now-60*60000) || null; }
function logTemplate(k, mk, tp, water){
  const d=clone(dayDoc(k)); d.kind="day"; d.date=k; d.entries=d.entries||[];
  for(const i of tp.items||[]){ const v=calc(i.per,i.g); d.entries.push({id:uid(),meal:mk,name:i.name,g:i.g,per:i.per,portion:i.portion||null,foodId:i.foodId||null,kcal:v.kcal,p:v.p,f:v.f,c:v.c}); }
  if(water) addWaterL(d,0.25);
  writeDoc(pk("day-")+k,d);
}
function setWake(ts){
  const day=keyOf(new Date(ts));
  UI.date=day; UI.lastToday=day; UI.wakeEdit=false;
  const d=clone(dayDoc(day)); d.kind="day"; d.date=day; d.wake={at:ts};
  S.docs[pk("wake")]={kind:"wake",at:ts,day};
  writeDoc(pk("day-")+day,d); writeDoc(pk("wake"),S.docs[pk("wake")]);
  toast(`Sto opp kl ${hhmm(ts)}. Måltidstidene er oppdatert.`);
}
function wakeFromClock(t){ let ts=clockOn(calKey(),t); if(ts>Date.now()+30*60000) ts-=24*HOUR; return ts; }
function recentWakes(){ const c={};
  Object.keys(S.docs).filter(k=>k.startsWith(pk("day-"))).sort().reverse().slice(0,30).forEach(k=>{ const w=S.docs[k].wake; if(w&&w.at){ const t=hhmm(w.at); c[t]=(c[t]||0)+1; } });
  const arr=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,3); const dw=plan().defaultWake;
  if(!arr.includes(dw)&&arr.length<3) arr.push(dw); return arr.sort(); }

/* ---------- reminders (Android) ---------- */
let schedT=null;
function reschedule(){ clearTimeout(schedT); schedT=setTimeout(pushReminders,500); }
const canRemind = () => !!(window.Android&&Android.scheduleReminders);
function hashId(str){ let h=7; for(const c of str) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h)%2000000000+1; }
function reminderList(){ const all=[];
  for(const p of people().list) withPerson(p.id, ()=>{ all.push(...reminderListFor(p)); });
  return all; }
function reminderListFor(person){
  const pl=plan(); if(!pl.reminders) return [];
  const who = multi() ? ` · ${person.name}` : "";
  const now=Date.now(), t=todayKey(), out=[]; let lastToday=0;
  for(const k of [t, addDays(t,1)]){
    const d=dayDoc(k);
    for(const sl of daySchedule(k)){
      if(k===t) lastToday=Math.max(lastToday, sl.at);
      else if(sl.at<lastToday+5*HOUR) continue;
      if(sl.at<now+30000 || hasMeal(d,sl.meal)) continue;
      const tp=tplById(sl.tpl), what=tp?`${tp.name}, ${r0(tplTotals(tp).kcal)} kcal. `:"";
      const text = sl.meal==="pre" ? `Trening kl ${hhmm(sl.train)}. ${what||"Spis litt nå. "}Husk et glass vann.` : `${what||"Tid for å spise. "}Husk et glass vann.`;
      out.push({id:hashId(person.id+":"+k+":"+sl.meal), at:sl.at, title:`${meal(sl.meal)} kl ${hhmm(sl.at)}${who}`, text, slot:person.id+"|"+sl.meal, day:k});
    }
  }
  return out;
}
function pushReminders(){ if(!canRemind()||!S.ready) return; try{ Android.scheduleReminders(JSON.stringify(reminderList())); }catch(e){} }

/* ---------- Google Sheets-synk: sender dager, vekt og Garmin-tall til et regneark som coachen leser ----------
   Hver post sendes som GET til en Google Apps Script-nettapp (se data/coach/Kode.gs) via httpJson.
   Bare poster som er endret siden sist sendes; fingeravtrykk ligger i localStorage under SYNC_LS. */
const SYNC_LS="makrologg.sync";
const SY={busy:false,t:null,err:null,left:0};
function syncState(){ try{ const s=JSON.parse(localStorage.getItem(SYNC_LS)||"{}"); s.sent=s.sent||{}; return s; }catch(e){ return {sent:{}}; } }
function syncSave(st){ try{ localStorage.setItem(SYNC_LS,JSON.stringify(st)); }catch(e){} }
const sheetUrl = () => String((S.docs.settings||{}).sheetUrl||"").trim();
function syncSoon(ms=5000){ if(!S.ready||!sheetUrl()) return; queueNightSync(); clearTimeout(SY.t); SY.t=setTimeout(runSync,ms); }
/* Nightly send at 23:50: the Android side keeps the latest copy of today's and yesterday's records and sends
   them itself, so food logged after the last successful sync still reaches the sheet even if the app was closed. */
function queueNightSync(){
  if(!(window.Android&&Android.queueCoachSync)) return;
  const url=sheetUrl(); if(!url) return;
  try{
    const t=todayKey(), days=new Set([t, addDays(t,-1), keyOf(new Date())]);
    const urls=syncRecords().filter(r=>days.has(r.date)).map(r=>url+(url.includes("?")?"&":"?")+"d="+encodeURIComponent(JSON.stringify(r)));
    Android.queueCoachSync(JSON.stringify(urls));
  }catch(e){}
}
const morningDoc = () => S.docs[pk("morning")] || {kind:"morning",items:{}};
function syncRecords(){
  const out=[];
  for(const p of people().list) withPerson(p.id,()=>{
    const base={pid:p.id,person:p.name||p.id}, pre=pk("day-");
    for(const k of Object.keys(S.docs)){
      if(!k.startsWith(pre)) continue;
      const date=k.slice(pre.length); if(!/^\d{4}-\d\d-\d\d$/.test(date)) continue;
      const d=S.docs[k]||{}, es=d.entries||[];
      const t=es.reduce((a,e)=>{ a.kcal+=e.kcal||0; a.p+=e.p||0; a.f+=e.f||0; a.c+=e.c||0; return a; },{kcal:0,p:0,f:0,c:0});
      const g=goalsFor(date), known=MEALS.map(m=>m[0]);
      const groups=MEALS.map(([mk,ml])=>[ml,es.filter(e=>e.meal===mk)]).concat([["Annet",es.filter(e=>!known.includes(e.meal))]]);
      const food=groups.filter(x=>x[1].length).map(([ml,xs])=>ml+": "+xs.map(e=>`${e.name}${e.quick?"":" "+r0(e.g)+" g"} (${r0(e.kcal)} kcal, ${r0(e.p)} g P)`).join(", ")).join(" | ");
      out.push(Object.assign({t:"day",date,kcal:r0(t.kcal),p:r0(t.p),c:r0(t.c),f:r0(t.f),water:(()=>{ const ws=waterState(d); return ws.l!=null?Math.round(ws.l*40)/10:(ws.ans==="nei"?0:""); })(),
        train:isTraining(date)?((d.train&&d.train.time)||plan().pre.defaultTime):"",wake:d.wake&&d.wake.at?hhmm(d.wake.at):"",
        gk:r0(g.kcal),gp:r0(g.p),gc:r0(g.c),gf:r0(g.f),n:es.length,food:food.length>3000?food.slice(0,3000)+" …":food},base));
    }
    for(const [date,kg] of Object.entries(weightsDoc().items||{})) out.push(Object.assign({t:"weight",date,kg},base));
    for(const [date,m] of Object.entries(morningDoc().items||{})) out.push(Object.assign({t:"morning",date},m,base));
  });
  return out.sort((a,b)=>a.date<b.date?1:-1);       /* nyeste først */
}
const recKey = r => r.t+"|"+r.pid+"|"+r.date;
function syncPending(){ const st=syncState(); return syncRecords().filter(r=>st.sent[recKey(r)]!==hashId(JSON.stringify(r))); }
async function runSync(){
  const url=sheetUrl(); if(!url||SY.busy) return;
  SY.busy=true; SY.err=null; showSync();
  const st=syncState(), todo=syncPending().slice(0,40);
  try{
    for(const r of todo){
      const res=await httpJson(url+(url.includes("?")?"&":"?")+"d="+encodeURIComponent(JSON.stringify(r)));
      if(res.status!==200||!res.json||!res.json.ok) throw new Error(res.json&&res.json.error ? res.json.error : "svar "+res.status);
      st.sent[recKey(r)]=hashId(JSON.stringify(r)); st.last=Date.now(); syncSave(st);
    }
  }catch(e){ SY.err = e&&e.message==="net"||e&&e.message==="timeout" ? "Ingen nettforbindelse" : (e&&e.message)||"Ukjent feil"; }
  SY.busy=false; SY.left=syncPending().length; showSync();
  if(!SY.err && SY.left) syncSoon(1000);
  else if(SY.err) syncSoon(10*60e3);                /* prøv igjen om 10 min */
}
function syncStatusText(){
  if(!sheetUrl()) return "Ikke koblet til.";
  if(SY.busy) return "Sender …";
  const st=syncState(), last=st.last?`Sist sendt ${dateLabel(keyOf(new Date(st.last))).toLowerCase()} kl. ${hhmm(st.last)}.`:"Ikke sendt ennå.";
  if(SY.err) return `Feil: ${SY.err}. ${last} Prøver igjen senere.`;
  const n=syncPending().length; return last+(n?` ${n} venter.`:" Alt er sendt.");
}
function showSync(){ const el=$("#syncStatus"); if(el) el.textContent=syncStatusText(); }

/* the most recent earlier day (within a week) that has this meal logged */
const WEEKDAYS=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
function waterState(d){ const ans=d.waterAns||((d.water||0)>0?"ja":null);
  const l=d.waterL!=null?d.waterL:((d.water||0)>0?d.water*0.25:null); return {ans,l}; }
function addWaterL(d, liters){ const ws=waterState(d); d.waterAns="ja"; d.waterL=Math.round(((ws.l||0)+liters)*100)/100; }
function lastMeal(k, mk){
  for(let i=1;i<=7;i++){ const k2=addDays(k,-i), es=(dayDoc(k2).entries||[]).filter(e=>e.meal===mk);
    if(es.length) return {k:k2, es, kcal:es.reduce((a,e)=>a+e.kcal,0), label: i===1?"i går":WEEKDAYS[parseKey(k2).getDay()]}; }
  return null;
}
function kasStatusLine(){
  const st=UI.kasStatus;
  if(st==="testing") return `<div class="busy"><div class="spin"></div>Tester nøkkelen …</div>`;
  if(st==="ok") return `<div class="okline">Nøkkelen virker. Søk og skanning bruker nå norske butikkvarer.</div>`;
  if(st==="bad") return `<div class="note err">Kassalapp avviste nøkkelen. Sjekk at du kopierte hele nøkkelen, eller lag en ny.</div>`;
  if(st==="net") return `<div class="note err">Fikk ikke kontakt med Kassalapp. Nøkkelen er lagret, prøv igjen når du har nett.</div>`;
  return kassalKey()?`<div class="okline">Nøkkel lagret.</div>`:"";
}
function personBar(){
  if(!multi()) return "";
  return `<nav class="pbar" aria-label="Velg person">${people().list.map(p=>{
    const left = withPerson(p.id, ()=> goalsFor(UI.date).kcal - totals(dayDoc(UI.date)).kcal);
    return `<button class="pchip ${p.id===CUR?"on":""}" data-act="person" data-v="${p.id}" aria-pressed="${p.id===CUR}"><span class="dot" style="background:${pcolor(p)}"></span><span class="pn">${esc(p.name)}</span>${UI.tab==="dag"?`<small class="num ${left< -withPerson(p.id,()=>goalsFor(UI.date).kcal)*0.10?"ov":left<0?"wn":""}">${left<0?"+"+r0(-left)+" over":r0(left)+" igjen"}</small>`:""}</button>`;
  }).join("")}</nav>`;
}
function macroRow(label,val,goal,color){
  const pct=Math.min(100, goal? val/goal*100:0);
  const lvl = val>goal*1.10 ? "ov" : val>goal+0.5 ? "wn" : "", left=goal-val;
  return `<div class="mrow"><div class="mtop"><b>${label}</b><span class="num left ${lvl}">${left<-0.5?"+"+r0(-left)+" g over":r0(left)+" g igjen"}</span></div>
  <div class="bar"><i style="width:${pct}%;background:${lvl==="ov"?"var(--over)":lvl==="wn"?"var(--warn)":color}"></i></div><div class="msub num">${r0(val)} av ${r0(goal)} g</div></div>`;
}

function viewDay(){
  const g=goalsFor(UI.date), d=dayDoc(UI.date), t=totals(d);
  const left = g.kcal - t.kcal;
  const C=2*Math.PI*56, frac=Math.min(1, t.kcal/(g.kcal||1));
  const over = t.kcal>g.kcal;
  let h = UI.date!==todayKey() ? `<button class="todaybtn" data-act="today">Tilbake til i dag</button>` : "";
  h += `<section class="card summary">
    <div class="dial"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle cx="66" cy="66" r="56" fill="none" stroke="${t.kcal>g.kcal*1.10?"var(--over)":over?"var(--warn)":"var(--kcal)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}"/></svg>

/* Weekly budget (Monday–Sunday): what the logged days before this one saved or overspent against their goals,
   and what that leaves per day for the rest of the week, this day included. Days without food logged count as on goal. */
function weekBudget(k){
  const wd=(parseKey(k).getDay()+6)%7, mon=addDays(k,-wd);
  let bank=0, budget=0, past=0;
  for(let i=0;i<7;i++){ const dk=addDays(mon,i), g=goalsFor(dk).kcal; budget+=g;
    if(i<wd){ const d=dayDoc(dk), t=totals(d); if((d.entries||[]).length){ bank+=g-t.kcal; past+=t.kcal; } else past+=g; } }
  const left=7-wd, perDay=(budget-past)/left;
  return {bank, perDay, left, budget};
}
function weekLine(k){
  const w=weekBudget(k); if(Math.abs(w.bank)<1 && (parseKey(k).getDay()+6)%7===0) return `<div class="wline"><span>Uka (man–søn)</span><span>Budsjett <b class="num">${r0(w.budget).toLocaleString("nb-NO")}</b> kcal</span></div>`;
  return `<div class="wline"><span>Uka: ${w.bank>=0?`<b class="num good">${r0(w.bank)}</b> kcal spart`:`<b class="num bad">${r0(-w.bank)}</b> kcal over`}</span><span>Resten av uka ≈ <b class="num">${r0(w.perDay)}</b>/dag</span></div>`;
}

/* Dishes (retter): ingredients weighed raw, the finished pot weighed once; saved as one of "Mine matvarer"

function dishTotals(t){ const v={kcal:0,p:0,f:0,c:0,g:0}; t.items.forEach(i=>{ const x=calc(i.per,i.g); v.kcal+=x.kcal; v.p+=x.p; v.f+=x.f; v.c+=x.c; v.g+=i.g; }); return v; }

  el.innerHTML = c>0 ? macroPreview({kcal:tot.kcal*100/c,p:tot.p*100/c,f:tot.f*100/c,c:tot.c*100/c}) : ""; }

  const t=UI.tplDraft, tot=dishTotals(t), cooked=numIn(t.cooked)||tot.g;

/* ---------- Ukemeny og handleliste (innhold 22): én felles meny for alle personene. Hver rett får en porsjon per
   person regnet ut fra den personens mål den dagen; handlelista summerer ingrediensene for uka. ---------- */
const menuDoc = () => S.docs.menu || {kind:"menu",days:{},shop:{}};
const MENU_SLOTS = [["middag","Middag"],["matboks","Matboks"]];
const MENU_SHARE = 0.3;                                   /* middag ≈ 30 % av dagens kalorimål */
const MENU_LOGMEAL = {middag:"middag", matboks:"snacks"};
const mondayOf = k => addDays(k, -((parseKey(k).getDay()+6)%7));
function weekNo(k){ const d=parseKey(k); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const y=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d-y)/86400000-3+((y.getDay()+6)%7))/7); }
function shortDate(k){ const d=parseKey(k); return d.getDate()+"."+(d.getMonth()+1)+"."; }
function menuSrc(ref){ if(!ref) return null; if(ref.t==="tpl") return tplById(ref.id);
  return (foodsDoc().items||{})[ref.id] || allFoods().find(f=>f.id===ref.id) || null; }
function menuVal(ref, amt){ const s=menuSrc(ref); if(!s||!(amt>0)) return null;
  if(ref.t==="tpl"){ const t=tplTotals(s); return {kcal:t.kcal*amt,p:t.p*amt,f:t.f*amt,c:t.c*amt}; }
  return calc(s.per, amt); }
const FRAC = {0.25:"¼",0.5:"½",0.75:"¾"};
function portionText(m){ const w=Math.floor(m+1e-9), f=Math.round((m-w)*4)/4, fs=FRAC[f]||(f?fmt1(f).replace(/^0/,""):"");
  return (w?String(w):"")+(fs||"")+(w||fs?"":"0")+" porsjon"; }
const menuAmtText = (ref, amt) => ref.t==="tpl" ? portionText(amt) : r0(amt)+" g";
function suggestAmt(ref, pid, k, slot){ const s=menuSrc(ref); if(!s) return 0;
  if(slot==="matboks") return ref.t==="tpl" ? 1 : (s.portion&&s.portion.g>0 ? s.portion.g : 100);
  const target=withPerson(pid,()=>goalsFor(k).kcal)*MENU_SHARE;
  if(ref.t==="tpl"){ const kc=tplTotals(s).kcal||1; return Math.min(3,Math.max(0.25,Math.round(target/kc*4)/4)); }
  return Math.max(10, Math.round(target/(s.per.kcal||1)*100/10)*10); }
function menuDay(k){ return (menuDoc().days||{})[k] || {items:[]}; }
function saveMenu(fn){ const m=clone(menuDoc()); m.kind="menu"; m.days=m.days||{}; m.shop=m.shop||{}; fn(m);
  for(const k in m.days) if(!(m.days[k].items||[]).length) delete m.days[k];
  writeDoc("menu", m); }
/* planned and not yet logged for the active person on day k */
function plannedFor(k){ return (menuDay(k).items||[]).filter(it=>it.by&&it.by[CUR]>0&&!(it.logged&&it.logged[CUR])&&menuSrc(it.ref)); }

function viewMenu(){

        return `${multi()?esc(p.name)+" ":""}<b>${esc(menuAmtText(it.ref,it.by[p.id]))}${v?" · "+r0(v.kcal):""}</b>${it.logged&&it.logged[p.id]?" ✓":""}`; }).join("<br>");
      return `<button class="mdish" data-act="menuEdit" data-k="${k}" data-v="${it.id}"><span class="nm"><span>${esc(s?s.name:it.name)}</span><small>${it.slot==="matboks"?"Matboks":s&&s.dish?"Rett":it.ref.t==="tpl"?"Fast måltid":"Matvare"}${s?"":" · finnes ikke lenger"}</small></span><span class="k num">${who}</span></button>`; }).join("");

    h+=`<section class="card mday ${k===today?"today":""}"><div class="dh"><b>${wd[0].toUpperCase()+wd.slice(1)}</b><span>${shortDate(k)}${k===today?" · i dag":""}</span></div>
      ${rows}
      <div class="madd">${hasDinner?"":`<button class="link sm" data-act="menuAdd" data-k="${k}" data-v="middag">+ Middag</button>`}<button class="link sm" data-act="menuAdd" data-k="${k}" data-v="matboks">+ Matboks</button>${hasDinner?`<button class="link sm" data-act="menuAdd" data-k="${k}" data-v="middag">+ Mer til middag</button>`:""}</div></section>`;
  }
  h+=`<button class="btn primary block" data-act="menuShop">Handleliste${n?` · ${n} middag${n===1?"":"er"}`:""}</button>
   <div class="note">Porsjonene regnes ut fra målet til hver person den dagen (middag ≈ 30 %). Du kan endre grammene når du legger til. Det som er planlagt, ligger klart under Dag og logges med ett trykk.</div>`;
  return h;
}

/* pick sheet: list of dishes, fixed meals and own foods; then portions per person */
function sheetMenuPick(s){

    const foods=Object.values(foodsDoc().items||{}).filter(hit);
    const dishes=foods.filter(f=>f.dish).sort((a,b)=>(b.dish.made||0)-(a.dish.made||0));

    if(dishes.length) h+=`<div class="sect">Retter</div><div class="list">${dishes.map(f=>row("food",f,`${r0(f.per.kcal)} kcal · ${r0(f.per.p)} g protein per 100 g`)).join("")}</div>`;

    if(own.length) h+=`<div class="sect">Mine matvarer</div><div class="list">${own.slice(0,q?40:15).map(f=>row("food",f,`${r0(f.per.kcal)} kcal per 100 g`)).join("")}</div>`;
    if(!dishes.length&&!tpls.length&&!own.length) h+=`<div class="note">${q?"Ingen treff.":"Du har ingen retter eller faste måltider ennå."} Lag en rett med «Ny rett» på Dag, eller et fast måltid under Innstillinger, så kan du velge den her.</div>`;

   <div class="field"><span class="flabel">Hvem spiser – ${tpl?"porsjoner":"gram"}</span><div class="whos">${ppl.map(p=>{ const on=s.who[p.id]!=null;
     return `<div class="who"><label class="chk"><input type="checkbox" data-mwho="${p.id}" ${on?"checked":""}> ${esc(p.name)}</label>
       <span class="mprev num" id="mp-${p.id}"></span>
       <input class="inp num whog" data-mw="${p.id}" inputmode="decimal" aria-label="${tpl?"Porsjoner":"Gram"} for ${esc(p.name)}" value="${on?esc(String(s.who[p.id]).replace(".",",")):""}" ${on?"":"disabled"}></div>`; }).join("")}</div></div>
   ${tpl?`<div class="note">1 = én porsjon slik det faste måltidet er lagret. 0,75 = tre firedeler.</div>`:""}
   <button class="btn primary block" data-act="menuSave">${s.itemId?"Lagre":"Legg til "+WEEKDAYS[parseKey(s.day).getDay()]}</button>
   ${s.itemId?`<button class="btn danger block" data-act="menuDel">Fjern fra menyen</button>`:""}`;
  return h;
}
function updateMenuPreview(){ const s=UI.sheet; if(!s||s.type!=="menuPick"||!s.ref) return;
  for(const p of people().list){ const el=document.getElementById("mp-"+p.id); if(!el) continue;
    const v=s.who[p.id]!=null?menuVal(s.ref,numIn(s.who[p.id])):null; el.textContent=v?`${r0(v.kcal)} kcal · ${r0(v.p)} g P`:""; } }

/* shopping list: ingredients of the week's planned food; a dish counts as whole pots */
const SHOP_CATS=[["Brød og tørrvarer",/peanøtt|nøtt|mandel|ris\b|ris |^ris|pasta|spaghetti|nudler|mel\b|hvetemel|havre|brød|lefse|tortilla|wrap|knekkebrød|müsli|gryn|couscous|bulgur|krydder|buljong|olje|sukker|honning|sirup|ketchup|sennep|majones|soya|taco|salsa|hermetisk|bønner på boks/i],
  ["Kjøtt og pålegg",/kjøtt|deig|filet|biff|svin|storfe|okse|kotelett|bacon|skinke|pølse|kalkun|lam\b|lamme|elg|hjort|karbonade|entrecote|kebab|reke|scampi|pålegg|salami|leverpostei/i],
  ["Frukt og grønt",/brokkoli|gulrot|løk|hvitløk|paprika|tomat|agurk|salat|spinat|potet|banan|eple|appelsin|bær|avokado|squash|sopp|mais|erter|bønner|kål|purre|sitron|lime|ingefær|chili|frukt|grønnsak|selleri|aubergine|druer|mango|ananas|kiwi|pære/i],
  ["Meieri og egg",/melk|ost|yoghurt|skyr|kesam|rømme|fløte|smør|egg|cottage|crème|kremost|kvarg|matfløte/i]];
const shopCat = name => (SHOP_CATS.find(([,re])=>re.test(name))||["Annet"])[0];
function shopList(mon){
  const eaten={};                                          /* per source: total amount over the week */
  for(let i=0;i<7;i++){ const k=addDays(mon,i);
    for(const it of menuDay(k).items||[]){ const tot=Object.values(it.by||{}).reduce((a,x)=>a+(Number(x)||0),0); if(!(tot>0)) continue;
      const key=it.ref.t+":"+it.ref.id, e=eaten[key]||(eaten[key]={ref:it.ref,name:it.name,amt:0}); e.amt+=tot; } }
  const agg={};
  const add=(p,use)=>{ if(!(p.g>0)) return; const nm=String(p.name||"").replace(/\s*\(rå\)\s*$/i,"").trim(), key=nm.toLowerCase(); if(!key) return;
    const a=agg[key]||(agg[key]={key,name:nm,g:0,portion:p.portion||null,uses:[]}); a.g+=p.g; if(!a.portion&&p.portion) a.portion=p.portion; if(!a.uses.includes(use)) a.uses.push(use); };
  for(const e of Object.values(eaten)){ const s=menuSrc(e.ref); if(!s) continue;
    if(e.ref.t==="tpl") (s.items||[]).forEach(x=>add({name:x.name,g:x.g*e.amt,portion:x.portion},s.name));

function weightTrend(ws){
  const t=todayKey(), from=addDays(t,-42), pts=ws.filter(([k])=>k>=from).map(([k,v])=>[(parseKey(k)-parseKey(from))/864e5,v]);
  if(pts.length<2||pts[pts.length-1][0]-pts[0][0]<7) return null;
  const n=pts.length, mx=pts.reduce((a,p)=>a+p[0],0)/n, my=pts.reduce((a,p)=>a+p[1],0)/n;
  const num=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0), den=pts.reduce((a,p)=>a+(p[0]-mx)**2,0);
  return den? num/den*7 : null;
}
function goalPlan(){
  const prof=S.docs[pk("profile")]||{}, target=prof.targetWeight, td=prof.targetDate, t=todayKey();
  const ws=Object.entries(weightsDoc().items||{}).sort((a,b)=>a[0]<b[0]?-1:1);
  if(!target||!td||!ws.length) return null;
  const recent=ws.filter(([k])=>k>=addDays(ws[ws.length-1][0],-6)), cur=recent.reduce((a,x)=>a+x[1],0)/recent.length;
  const days=Math.round((parseKey(td)-parseKey(t))/864e5), left=cur-target, rate=weightTrend(ws);
  if(Math.abs(left)<0.3) return {done:true,target,td,cur,days};
  if(days<=0) return {past:true,target,td,cur,left,days};
  const need=-left/days*7, kcal=left*7700/days;
  let status="nodata";
  if(rate!=null){ const proj=cur+rate*days/7; status = (left>0? proj<=target+0.3 : proj>=target-0.3) ? "ok" : (Math.sign(rate)===Math.sign(need)&&Math.abs(rate)>=Math.abs(need)*0.6 ? "near" : "behind"); }
  return {target,td,cur,left,days,need,kcal,rate,status};
}

function renderSheet(){
  const root=$("#sheetRoot"), s=UI.sheet;
  document.documentElement.classList.toggle("lock", !!s);
  if(!s){ root.innerHTML=""; return; }
  const keepFocus=document.activeElement&&document.activeElement.id, selStart=document.activeElement&&document.activeElement.selectionStart;
  const sb=root.querySelector(".sb"), scroll=sb?sb.scrollTop:0;
  let title="", body="";
  if(s.type==="pick"){ title=s.meal==="tpl"?(UI.tplDraft&&UI.tplDraft.dish?"Legg til i retten":"Legg til i fast måltid"):"Legg til i "+meal(s.meal).toLowerCase(); body=sheetPick(s); }
  else if(s.type==="person"){ title=s.id?"Endre person":"Ny person"; body=sheetPerson(s); }
  else if(s.type==="quick"){ title=s.entryId?"Endre hurtiglogg":"Hurtiglogg"; body=sheetQuick(s); }
  else if(s.type==="slot"){ title=meal(s.slot)+(s.at?" kl "+hhmm(s.at):""); body=sheetSlot(s); }

/* ---------- Matvaretabellen (Mattilsynet), cached on the phone ---------- */
const MVT={foods:null,v:null};
const MVT_URL="https://raw.githubusercontent.com/breenskillz-ctrl/Makrologg/main/app/src/main/assets/matvaretabellen.json";
const PORTION_NAMES={stk:"1 stk",skive:"1 skive",porsjon:"1 porsjon",desiliter:"1 dl",spiseskje:"1 ss",teskje:"1 ts",glass:"1 glass",boks:"1 boks",pakke:"1 pakke",beger:"1 beger"};
const PORTION_ORDER=["stk","skive","porsjon","beger","boks","pakke","glass","spiseskje","teskje","desiliter"];
function mvtFromRaw(d){
  return (d.foods||[]).map(r=>{
    const portions=(r[5]||[]).filter(x=>x[2]==="g"&&x[1]>0)
      .sort((a,b)=>{ const ia=PORTION_ORDER.indexOf(a[0]), ib=PORTION_ORDER.indexOf(b[0]); return (ia<0?5:ia)-(ib<0?5:ib); })
      .map(x=>({label:PORTION_NAMES[x[0]]||("1 "+x[0]),g:x[1]}));
    return {id:"mvt:"+r[7],name:r[0],per:{kcal:r[1],p:r[2],f:r[3],c:r[4]},portions,portion:portions[0]||null,kw:(r[6]||[]).join(" ").toLowerCase(),base:true,src:"mvt"};
  });
}
function loadMvt(){
  try{ const c=JSON.parse(localStorage.getItem("makrologg.mvt")||"null"); if(c&&c.foods){ MVT.foods=mvtFromRaw(c); MVT.v=c.v; } }catch(e){}
  let last=0; try{ last=Number(localStorage.getItem("makrologg.mvt.checked")||0); }catch(e){}
  if(MVT.foods && Date.now()-last<7*864e5) return;
  httpJson(MVT_URL).then(r=>{
    if(r.status!==200||!r.json||!r.json.foods) return;
    if(r.json.v!==MVT.v){ try{ localStorage.setItem("makrologg.mvt",JSON.stringify(r.json)); }catch(e){}
      MVT.foods=mvtFromRaw(r.json); MVT.v=r.json.v; if(UI.sheet&&UI.sheet.type==="pick") renderSheet(); }
    try{ localStorage.setItem("makrologg.mvt.checked",String(Date.now())); }catch(e){}
  }).catch(()=>{});
}
function allFoods(){
  const mine=Object.values(foodsDoc().items||{});
  return mine.concat(MVT.foods||BASE);
}
const norm = x => String(x||"").toLowerCase();
function rankFoods(list,q){
  const qq=norm(q).trim(), toks=qq.split(/[\s,]+/).filter(Boolean); if(!toks.length) return [];
  const out=[];
  for(const f of list){
    const n=norm(f.name), words=n.split(/[^a-zæøåäöü0-9%]+/).filter(Boolean), kw=f.kw||"";
    let score=0, ok=true;
    for(const t of toks){
      if(words.some(w=>w.startsWith(t))) score+=10;
      else if(kw.split(" ").some(w=>w.startsWith(t))) score+=5;
      else if(n.includes(t)||(f.barcode||"").startsWith(t)) score+=2;
      else { ok=false; break; }
    }
    if(!ok) continue;
    if(n.startsWith(qq)) score+=30;
    if(words[0]&&words[0].startsWith(toks[0])) score+=15;
    if(words[0]===toks[0]) score+=14;
    if(!f.base) score+=12;
    if(/barnemat|morsmelkerstatning|sondemat|kosttilskudd/.test(n)) score-=30;
    score-=n.length*0.15;
    out.push([score,f]);
  }
  return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}

/* ---------- online search: Kassalapp (Norwegian shops) and Open Food Facts ---------- */
let onlineT=null;
function queueOnline(s){
  clearTimeout(onlineT);
  const q=norm(s.q).trim(); if(q.length<3) return;
  onlineT=setTimeout(()=>runOnline(s,q),450);
}
function runOnline(s,q){
  s.online=s.online||{}; if(s.online[q]) return;
  const o=s.online[q]={};
  const done=()=>{ if(UI.sheet===s && norm(s.q).trim()===q) renderSheet(); };
  const key=kassalKey();
  if(key){ o.kas={busy:true}; kassalSearch(q,key).then(r=>{ o.kas={res:r}; }).catch(e=>{ o.kas={err:e&&e.message==="auth"?"Kassalapp-nøkkelen ble avvist. Sjekk den under Innstillinger.":"Fikk ikke kontakt med Kassalapp."}; }).finally(done); }
  o.off={busy:true}; offSearch(q).then(r=>{ o.off={res:r}; }).catch(()=>{ o.off={err:"Fikk ikke kontakt med Open Food Facts."}; }).finally(done);
  done();
}
async function kassalSearch(q,key){
  const r=await httpJson(`https://kassal.app/api/v1/products?search=${encodeURIComponent(q)}&size=40&unique=1`,{Authorization:"Bearer "+key,Accept:"application/json"});
  if(r.status===401||r.status===403) throw new Error("auth");
  if(r.status!==200||!r.json) throw new Error("http "+r.status);
  const seen=new Set(), out=[];
  for(const p of (r.json.data||[])){
    const nut={}; (p.nutrition||[]).forEach(n=>{ if(n&&n.code) nut[n.code]=Number(n.amount); });
    let kcal=nut.energi_kcal; if(!isFinite(kcal)&&isFinite(nut.energi_kj)) kcal=nut.energi_kj/4.184;
    if(!isFinite(kcal)) continue;
    const brand=p.brand||p.vendor||"";
    const name=[p.name||"", brand&&!(p.name||"").toLowerCase().includes(brand.toLowerCase())?brand:""].filter(Boolean).join(" – ");
    const k=name.toLowerCase(); if(!name||seen.has(k)) continue; seen.add(k);
    const w=Number(p.weight), unit=String(p.weight_unit||"").toLowerCase();
    out.push({name,per:{kcal,p:nut.protein||0,f:nut.fett_totalt||0,c:nut.karbohydrater||0},
      portion: w>0&&w<=1500&&(unit==="g"||unit==="ml") ? {label:"1 pakke",g:w} : null, barcode:p.ean||null, source:"Kassalapp"});
    if(out.length>=20) break;
  }
  return out;
}
function onlineSection(s,q,key,label){
  const st=((s.online||{})[q]||{})[key]; if(!st) return "";
  if(st.busy) return `<div class="sect">${label}</div><div class="busy"><div class="spin"></div>Søker …</div>`;
  if(st.err) return `<div class="sect">${label}</div><div class="note err">${esc(st.err)}</div>`;
  if(!st.res.length) return "";
  return `<div class="sect">${label}</div><div class="list">${st.res.map((f,i)=>`<button data-act="pickOnline" data-v="${key}:${i}"><span class="nm">${esc(f.name)}<br><small class="num">${r0(f.per.kcal)} kcal · P ${fmt1(f.per.p)} · K ${fmt1(f.per.c)} · F ${fmt1(f.per.f)} per 100 g</small></span></button>`).join("")}</div>`;
}
function quickRow(f,pickAct,logAct,i){ const g=f.lastG>0?f.lastG:null, vv=g?calc(f.per,g):null;
  if(!g) return foodRow(f,pickAct);
  return `<div class="rrow"><button data-act="${pickAct}" data-v="${esc(f.id)}"><span class="nm">${esc(f.name)}<br><small class="num">Sist: ${r0(g)} g · ${r0(vv.kcal)} kcal · P ${r0(vv.p)} · K ${r0(vv.c)} · F ${r0(vv.f)}</small></span></button><button class="btn primary plus" data-act="${logAct}" data-v="${i}" aria-label="Logg ${esc(f.name)}, ${r0(g)} g">+</button></div>`; }
function logFoodNow(f,g,mk){ const v2=calc(f.per,g), d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; d.entries=d.entries||[];
  d.entries.push({id:uid(),meal:mk,name:f.name,g,per:f.per,portion:f.portion||null,foodId:f.foodId||(f.base||!f.id||/^[ru]\d+$/.test(f.id)?null:f.id),kcal:v2.kcal,p:v2.p,f:v2.f,c:v2.c});
  writeDoc(pk("day-")+UI.date,d); toast(`${f.name}, ${r0(g)} g lagt til i ${meal(mk).toLowerCase()}`); }
function recentFoods(){
  const seen=new Set(), out=[];
  const ks=Object.keys(S.docs).filter(k=>k.startsWith(pk("day-"))).sort().reverse();
  for(const k of ks){ for(const e of (S.docs[k].entries||[]).slice().reverse()){ const key=e.name.toLowerCase(); if(seen.has(key)||!e.per) continue; seen.add(key);
    out.push({id:e.foodId||"r"+out.length,name:e.name,per:e.per,portion:e.portion||null,lastG:e.g}); if(out.length>=6) return out; } }
  return out;
}
/* most logged foods over the last 60 days, skipping the ones already under «Nylig brukt» */
function mostUsed(skip){
  const from=addDays(todayKey(),-60), cnt={};
  for(const k of Object.keys(S.docs)){ if(!k.startsWith(pk("day-"))) continue; const date=k.slice(pk("day-").length); if(date<from) continue;
    for(const e of (S.docs[k].entries||[])){ if(!e.per) continue; const key=e.name.toLowerCase();
      const c=cnt[key]||(cnt[key]={n:0,date:"",f:null}); c.n++; if(date>=c.date){ c.date=date; c.f={name:e.name,per:e.per,portion:e.portion||null,lastG:e.g,foodId:e.foodId}; } } }
  return Object.entries(cnt).filter(([k,c])=>c.n>=2&&!skip.has(k)).sort((a,b)=>b[1].n-a[1].n).slice(0,10).map(([k,c],i)=>Object.assign({id:"u"+i,n:c.n},c.f));
}

/* ---------- barcode ---------- */
async function decodeBarcode(file){
  const url=URL.createObjectURL(file);
  try{
    if("BarcodeDetector" in window){
      try{ const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
        const bmp=await createImageBitmap(file); const r=await det.detect(bmp); if(r&&r.length) return r[0].rawValue; }catch(e){}
    }
    if(window.ZXing){
      try{ const hints=new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
        const reader=new ZXing.BrowserMultiFormatReader(hints); const res=await reader.decodeFromImageUrl(url); if(res) return res.getText(); }catch(e){}
    }
    // retry on a downscaled, grayscale copy (large phone photos often fail)
    if(window.ZXing){
      try{ const img=await createImageBitmap(file); const sc=Math.min(1,1400/Math.max(img.width,img.height));
        const cv=document.createElement("canvas"); cv.width=img.width*sc; cv.height=img.height*sc; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const reader=new ZXing.BrowserMultiFormatReader(); const res=await reader.decodeFromImageUrl(cv.toDataURL("image/jpeg",.9)); if(res) return res.getText(); }catch(e){}
    }
    if(SAMPLE){
      try{ const r=await SAMPLE.json('Les tallene under strekkoden (EAN/UPC) på bildet. Svar KUN med JSON: {"barcode":"<bare sifre>"} eller {"barcode":null} hvis du ikke ser noen.',{images:[await shrink(file)],modelTier:"quick"});
        if(r&&r.barcode&&/^\d{6,14}$/.test(String(r.barcode))) return String(r.barcode); }catch(e){ if(e&&e.code==="not_granted") throw e; }
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
async function shrink(file,max=1400){
  try{ const img=await createImageBitmap(file); const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.85)); }catch(e){ return file; }
}
const fileToURL = f => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
function findByBarcode(code){ return Object.values(foodsDoc().items||{}).find(p=>p.barcode===code); }
function handleCode(code){
  const s=UI.sheet; code=String(code).replace(/\D/g,"");
  if(!code){ s.msg="Skriv inn tallene under strekkoden."; s.err=true; renderSheet(); return; }
  s.cand=null; s.offline=null;

  s.busy="Slår opp "+code+" …"; s.msg=""; s.err=false; renderSheet();
  lookupBarcode(code).then(r=>{
    if(UI.sheet!==s) return;
    s.busy="";
    if(r.per){ s.cand=r; renderSheet(); return; }
    const why = r.name ? `Fant «${r.name}», men uten næringsverdier.` : "Fant ikke varen.";
    openSheet({type:"product", meal:s.meal, p:{barcode:code,name:r.name||""}, msg:`${why} Fyll inn verdiene fra etiketten (per 100 g), så husker appen varen neste gang.`});
  }).catch(()=>{ if(UI.sheet!==s) return; s.busy=""; s.msg="Fikk ikke kontakt med databasene. Sjekk nettet, eller legg inn varen selv."; s.err=true; s.offline=code; renderSheet(); });

/* lookup order: Kassalapp (if key) -> Open Food Facts. Returns {per,...} or {name} or {} */
async function lookupBarcode(code){
  let name="", image="", errors=0, tried=0;
  const key=kassalKey();
  if(key){ tried++;
    try{ const k=await kassalLookup(code,key); if(k&&k.per) return k; if(k&&k.name){ name=k.name; image=k.image||""; } }catch(e){ errors++; } }
  tried++;
  try{ const o=await offLookup(code);
    if(o&&o.per){ if(name){ o.name=name; o.source="Kassalapp og Open Food Facts"; if(image) o.image=image; } return o; }
    if(o&&o.name&&!name) name=o.name;
  }catch(e){ errors++; }
  if(errors===tried) throw new Error("offline");
  return {name};
}

/* native HTTP (no CORS limits) with plain fetch as fallback */
const NF={n:0,cb:{}};
window.onNativeFetch=(id,status,body)=>{ const f=NF.cb[id]; delete NF.cb[id]; if(f) f(status,body); };
function httpJson(url, headers={}){
  if(window.Android&&Android.fetchText){
    return new Promise((res,rej)=>{ const id=String(++NF.n); const t=setTimeout(()=>{ delete NF.cb[id]; rej(new Error("timeout")); },15000);
      NF.cb[id]=(st,body)=>{ clearTimeout(t); if(st===0) return rej(new Error("net")); try{ res({status:st,json:body?JSON.parse(body):null}); }catch(e){ res({status:st,json:null}); } };
      Android.fetchText(id,url,JSON.stringify(headers)); });
  }
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  return fetch(url,{headers,signal:ctl.signal}).then(async r=>({status:r.status,json:await r.json().catch(()=>null)})).finally(()=>clearTimeout(t));
}

/* ---------- Kassalapp ---------- */
const kassalKey = () => (S.docs.settings||{}).kassalKey || ((S.docs.profile||{}).settings||{}).kassalKey || "";
async function kassalLookup(code,key){
  const r=await httpJson(`https://kassal.app/api/v1/products/ean/${encodeURIComponent(code)}`,{Authorization:"Bearer "+key,Accept:"application/json"});
  if(r.status===401||r.status===403){ toast("Kassalapp-nøkkelen ble avvist. Sjekk den under Innstillinger."); throw new Error("auth"); }
  if(r.status===404) return null;
  if(r.status!==200||!r.json||!r.json.data) throw new Error("http "+r.status);
  const d=r.json.data, prods=d.products||[], p=prods.find(x=>x&&x.name)||{};
  const brand=p.brand||p.vendor||"";
  const name=[p.name||"", brand && !(p.name||"").toLowerCase().includes(brand.toLowerCase()) ? brand : ""].filter(Boolean).join(" – ");
  const image=(prods.find(x=>x&&x.image)||{}).image||"";
  const nut={}; (d.nutrition||[]).forEach(n=>{ if(n&&n.code) nut[n.code]=Number(n.amount); });
  let kcal=nut.energi_kcal; if(!isFinite(kcal)&&isFinite(nut.energi_kj)) kcal=nut.energi_kj/4.184;
  if(!isFinite(kcal)) return {name,image};
  return {name:name||("Vare "+code),image,source:"Kassalapp",barcode:code,
    per:{kcal:kcal||0,p:nut.protein||0,f:nut.fett_totalt||0,c:nut.karbohydrater||0},portion:null};
}

const OFF_FIELDS="code,product_name,product_name_nb,product_name_no,product_name_en,generic_name,brands,quantity,nutriments,serving_quantity,serving_size,image_front_small_url";
function offToProduct(p, code){
  const n=p.nutriments||{};
  let kcal=n["energy-kcal_100g"];
  if(kcal==null && n["energy_100g"]!=null) kcal=n["energy_100g"]/4.184;
  if(kcal==null) return null;
  const base=p.product_name_nb||p.product_name_no||p.product_name||p.product_name_en||p.generic_name||"";
  const brands=p.brands?String(p.brands).split(",").map(x=>x.trim()).filter(Boolean):[];
  const brand=brands.find(b=>!base.toLowerCase().includes(b.toLowerCase()))||"";
  const name=[base||brands.join(" "), base?brand:"", p.quantity||""].filter(Boolean).join(" – ")||("Vare "+code);
  const sq=Number(p.serving_quantity);
  return {name, per:{kcal:Number(kcal)||0,p:Number(n.proteins_100g)||0,f:Number(n.fat_100g)||0,c:Number(n.carbohydrates_100g)||0},
    portion: sq>0?{label:p.serving_size?String(p.serving_size).slice(0,24):"1 porsjon",g:sq}:null, barcode:code||p.code||null,
    source:"Open Food Facts", image:p.image_front_small_url||""};
}
async function offLookup(code){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{ const r=await httpJson(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
    if(r.status===404) return {missing:true}; if(r.status!==200||!r.json) throw new Error("http"); const j=r.json; if(j.status!==1||!j.product) return {missing:true};
    return offToProduct(j.product,code)||{noNutrition:true,name:j.product.product_name||""};
  } finally { clearTimeout(t); }
}
async function offSearch(q){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
  try{ const r=await httpJson(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&tagtype_0=countries&tag_contains_0=contains&tag_0=norway&fields=${OFF_FIELDS}`);
    if(r.status!==200||!r.json) throw new Error("http"); const j=r.json; return (j.products||[]).map(p=>offToProduct(p,p.code)).filter(Boolean).slice(0,15);
  } finally { clearTimeout(t); }
}

  else if(a==="sex"){ calcSex=v; document.querySelectorAll("#sexSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); }
  else if(a==="calc"){
    const prof=(S.docs[pk("profile")]||{}).body||{};
    const sex=calcSex||prof.sex||"m", age=numIn($("#ca").value), h=numIn($("#ch").value), w=numIn($("#cw").value), act=numIn($("#cact").value), gl=numIn($("#cgoal").value);
    if(!age||!h||!w){ toast("Fyll inn alder, høyde og vekt"); return; }
    const bmr=10*w+6.25*h-5*age+(sex==="k"?-161:5);
    const floor = sex==="k"?1200:1500;
    let kcal=Math.round((bmr*act+gl)/10)*10;
    if(kcal<floor){ kcal=floor; setTimeout(()=>toast(`Kalorimålet er satt til ${floor} kcal, det laveste vi anbefaler.`),2600); }
    const pPer = gl<0?2.0:gl>0?1.9:1.8;
    const p=Math.round(w*pPer), f=Math.round(kcal*(gl<0?0.27:0.28)/9), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
    $("#gk").value=kcal; $("#gp").value=p; $("#gf").value=f; $("#gc").value=c; updateGoalSum();
    const pr=clone(S.docs[pk("profile")]||{kind:"profile"}); pr.kind="profile"; pr.body={sex,age,height:h,weight:w,act:String(act),goal:String(gl)};
    pr.goals={kcal,p,c,f,water:goals().water}; writeDoc(pk("profile"),pr);
    toast(`Vedlikehold ca. ${Math.round(bmr*act/10)*10} kcal. Mål lagret.`); }
  else if(a==="logWeight"){ const w=numIn($("#wIn").value); if(w<20||w>400){ toast("Skriv inn vekten i kg"); return; }
    const k=($("#wDate")&&$("#wDate").value)||todayKey();
    const wd=clone(weightsDoc()); wd.kind="weights"; wd.items=wd.items||{}; wd.items[k]=w; writeDoc(pk("weights"),wd); toast(`Vekt logget for ${dateLabel(k).toLowerCase()}`); }
  else if(a==="allW"){ UI.allW=!UI.allW; render(); }
  else if(a==="editWeight"){ openSheet({type:"weight",date:v,kg:(weightsDoc().items||{})[v]}); }
  else if(a==="saveWeightEdit"){ const s=UI.sheet, w=numIn($("#weKg").value), k=$("#weDate").value||s.date; if(w<20||w>400){ toast("Skriv inn vekten i kg"); return; }
    const wd=clone(weightsDoc()); wd.kind="weights"; wd.items=wd.items||{}; delete wd.items[s.date]; wd.items[k]=w; closeSheet(); writeDoc(pk("weights"),wd); toast("Vekt endret"); }
  else if(a==="deleteWeight"){ const s=UI.sheet, wd=clone(weightsDoc()); wd.kind="weights"; wd.items=wd.items||{}; delete wd.items[s.date]; closeSheet(); writeDoc(pk("weights"),wd); toast("Måling slettet"); }
  else if(a==="setPal"){ const st=clone(S.docs.settings||{kind:"settings"}); st.kind="settings"; st.palette=v||""; writeDoc("settings",st); }
  else if(a==="logRecent"||a==="logUsed"){ const list=a==="logRecent"?UI.sheet.rec:UI.sheet.used, f=list&&list[Number(v)]; if(!f) return;
    const mk=UI.sheet.meal&&UI.sheet.meal!=="tpl"?UI.sheet.meal:guessMeal(); closeSheet(); logFoodNow(f,f.lastG,mk); }
  else if(a==="noteOpen"){ UI.noteOpen=true; render(); setTimeout(()=>{ const el=$("#dayNote"); if(el) el.focus(); },30); }
  else if(a==="calMonth"){ UI.calMonth=v; render(); }
  else if(a==="goalsOpen"){ UI.goalsOpen=!UI.goalsOpen; render(); }
  else if(a==="allM"){ UI.allM=!UI.allM; render(); }
  else if(a==="logMeasure"){ const rec={}; for(const [k] of MEAS){ const x=numIn($("#ms-"+k).value); if(x>=20&&x<=250) rec[k]=x; }
    if(!Object.keys(rec).length){ toast("Skriv inn minst ett mål i cm"); return; }
    const md=clone(measDoc()); md.kind="measures"; md.items=md.items||{}; md.items[todayKey()]=Object.assign(md.items[todayKey()]||{},rec); writeDoc(pk("measures"),md); toast("Kroppsmål logget"); }
  else if(a==="editMeasure"){ openSheet({type:"measure",date:v}); }
  else if(a==="saveMeasureEdit"){ const s=UI.sheet, rec={}; for(const [k] of MEAS){ const x=numIn($("#me-"+k).value); if(x>=20&&x<=250) rec[k]=x; }
    const k2=$("#meDate").value||s.date, md=clone(measDoc()); md.kind="measures"; md.items=md.items||{}; delete md.items[s.date]; if(Object.keys(rec).length) md.items[k2]=rec;
    closeSheet(); writeDoc(pk("measures"),md); toast("Kroppsmål lagret"); }
  else if(a==="deleteMeasure"){ const s=UI.sheet, md=clone(measDoc()); md.kind="measures"; md.items=md.items||{}; delete md.items[s.date]; closeSheet(); writeDoc(pk("measures"),md); toast("Måling slettet"); }
  else if(a==="mealMove"){ const list=MEALS.map(([k,l])=>({k,label:l,hidden:MEALS_HIDDEN.has(k)})), i=list.findIndex(x=>x.k===v), j=i+Number(t.dataset.k||0);
    if(i<0||j<0||j>=list.length) return; [list[i],list[j]]=[list[j],list[i]]; saveMealCfg(list); }
  else if(a==="mealReset"){ const st=clone(S.docs.settings||{kind:"settings"}); st.kind="settings"; delete st.mealCfg; writeDoc("settings",st); toast("Måltidene er tilbakestilt"); }
  else if(a==="menuCopyPrev"){ const mon=UI.menuWeek||mondayOf(todayKey()); let n=0;
    saveMenu(m=>{ for(let i=0;i<7;i++){ const k=addDays(mon,i), src=(m.days[addDays(mon,i-7)]||{}).items||[]; if(((m.days[k]||{}).items||[]).length||!src.length) continue;
      m.days[k]={items:src.map(it=>Object.assign(clone(it),{id:uid(),logged:{}}))}; n+=src.length; } });
    toast(n?`${n} ${n===1?"rett":"retter"} kopiert fra forrige uke`:"Ingenting å kopiere"); }
  else if(a==="gmToggle"){ UI.gmOpen=!UI.gmOpen; render(); }
  else if(a==="backupLater"){ const st=clone(S.docs.settings||{kind:"settings"}); st.kind="settings"; st.backupSnooze=Date.now()+7*864e5; writeDoc("settings",st); }
  else if(a==="copyMeal"){ const others=people().list.filter(x=>x.id!==CUR); const to={}; if(others[0]) to[others[0].id]=true; openSheet({type:"copyMeal",mk:v,pct:100,to}); }
  else if(a==="cmPct"){ UI.sheet.pct=Number(v); renderSheet(); }
  else if(a==="copyMealDo"){ const s=UI.sheet, f=(Number(s.pct)||100)/100, es=(dayDoc(UI.date).entries||[]).filter(e=>s.mk==="*"||e.meal===s.mk), ids=Object.keys(s.to).filter(k=>s.to[k]);
    if(!ids.length){ toast("Velg minst én person"); return; }
    for(const pid of ids) for(const e of es) addToDay(pid, UI.date, Object.assign(clone(e),{id:uid(),g:(e.g||0)*f,kcal:e.kcal*f,p:e.p*f,c:e.c*f,f:e.f*f}));
    closeSheet(); toast(`${s.mk==="*"?"Dagen":meal(s.mk)} kopiert til ${ids.map(x=>personOf(x).name).join(", ")}${f!==1?` (${r0(f*100)} %)`:""}`); }
  else if(a==="cnt"){ const s=UI.sheet, u=amtUnits(s.food)[s.unitIdx||0]; if(!u) return; let c=numIn($("#amtG").value)/u.g;
    c = Number(v)>0 ? (c<1 ? Math.floor(c*2+1e-9)/2+0.5 : Math.floor(c+1e-9)+1) : (c<=1 ? Math.max(0.5,Math.ceil(c*2-1e-9)/2-0.5) : Math.ceil(c-1e-9)-1);
    const g=r1(c*u.g); s.g=g; $("#amtG").value=g; updateAmountPreview(); }
  else if(a==="unit"){ const s=UI.sheet, units=amtUnits(s.food), old=units[s.unitIdx||0], c=old?numIn($("#amtG").value)/old.g:1; s.unitIdx=Number(v); s.g=r1(Math.max(0.5,Math.round(c*2)/2)*units[s.unitIdx].g); renderSheet(); }
});

document.addEventListener("input", ev=>{
  if(ev.target&&ev.target.id==="dishCooked"){ updateDishPer(); return; }
  if(ev.target&&ev.target.id==="mq"&&UI.sheet){ UI.sheet.q=ev.target.value; renderSheet(); return; }
  if(ev.target&&ev.target.dataset&&ev.target.dataset.mw&&UI.sheet){ UI.sheet.who[ev.target.dataset.mw]=ev.target.value; updateMenuPreview(); return; }
  const id=ev.target.id;
  if(id==="q" && UI.sheet){ UI.sheet.q=ev.target.value; renderSheet(); queueOnline(UI.sheet); }
  else if(id==="foodQ"){ const el=$("#myFoods"); if(el) el.innerHTML=myFoodsList(ev.target.value); }
  else if(id==="amtG"){ UI.sheet.g=ev.target.value; updateAmountPreview(); }
  else if(id==="amtMeal"){ UI.sheet.meal=ev.target.value; }
  else if(["gk","gp","gc","gf"].includes(id)) updateGoalSum();
  else if(id==="estText" && UI.sheet) UI.sheet.text=ev.target.value;
  else if(id==="tplName" && UI.tplDraft) UI.tplDraft.name=ev.target.value;
  else if(["qkK","qkP","qkC","qkF"].includes(id)) updateQuickHint();
  else if(ev.target.dataset && ev.target.dataset.whog && UI.sheet){ UI.sheet.who[ev.target.dataset.whog]=ev.target.value; }
});
document.addEventListener("change", ev=>{
  if(ev.target.dataset && ev.target.dataset.mwho && UI.sheet && UI.sheet.type==="menuPick"){ const s=UI.sheet, pid=ev.target.dataset.mwho;
    if(ev.target.checked) s.who[pid]=suggestAmt(s.ref,pid,s.day,s.slot); else delete s.who[pid]; renderSheet(); return; }
  if(ev.target.matches("[data-est]") && UI.sheet && UI.sheet.items){ UI.sheet.items[Number(ev.target.dataset.est)].on=ev.target.checked; }
  if(ev.target.id==="amtMeal" && UI.sheet) UI.sheet.meal=ev.target.value;
  if(ev.target.id==="datePick" && ev.target.value){ UI.date=ev.target.value; ev.target.style.pointerEvents="none"; render(); }
  if(ev.target.matches("[data-pl]")) savePlanForm();
  if(ev.target.id==="dayNote"){ const d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; const tx=ev.target.value.trim(); if(tx) d.note=tx; else delete d.note; UI.noteOpen=false; writeDoc(pk("day-")+UI.date,d); toast(tx?"Notat lagret":"Notat fjernet"); }
  if(ev.target.dataset&&(ev.target.dataset.mlabel||ev.target.dataset.mshow)){ const list=MEALS.map(([k,l])=>({k,label:l,hidden:MEALS_HIDDEN.has(k)}));
    const m=list.find(x=>x.k===(ev.target.dataset.mlabel||ev.target.dataset.mshow)); if(!m) return;
    if(ev.target.dataset.mlabel) m.label=ev.target.value.trim()||MEALS_BASE.find(b=>b[0]===m.k)[1]; else m.hidden=!ev.target.checked; saveMealCfg(list); }
  if(ev.target.id==="wTargetDate"){ const pr=clone(S.docs[pk("profile")]||{kind:"profile"}); pr.kind="profile"; pr.targetDate=ev.target.value||null; writeDoc(pk("profile"),pr); }
  if(ev.target.id==="wTarget"){ const pr=clone(S.docs[pk("profile")]||{kind:"profile"}); pr.kind="profile"; const v=numIn(ev.target.value); pr.targetWeight = v>=20&&v<=400 ? v : null; writeDoc(pk("profile"),pr); toast(pr.targetWeight?`Målvekt: ${fmt1(v)} kg`:"Målvekt fjernet"); }
  if(ev.target.dataset && ev.target.dataset.cm && UI.sheet && UI.sheet.to){ UI.sheet.to[ev.target.dataset.cm]=ev.target.checked; }
  if(ev.target.dataset && ev.target.dataset.who && UI.sheet){ const pid=ev.target.dataset.who, s=UI.sheet; s.who=s.who||{};
    if(s.type==="quick"){ s.name=$("#qkName").value; s.kcal=$("#qkK").value; s.p=$("#qkP").value; s.c=$("#qkC").value; s.f=$("#qkF").value; const qm=$("#qkMeal"); if(qm) s.meal=qm.value; }
    if(ev.target.checked){ const g=$("#amtG"); s.who[pid]= s.type==="amount" ? (g?g.value:"") : 1; } else delete s.who[pid];
    renderSheet(); const inp=document.querySelector(`[data-whog="${pid}"]`); if(inp&&ev.target.checked) inp.focus(); }
  if(ev.target.id==="trainChk"){ const d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; d.train=Object.assign({},d.train,{on:ev.target.checked,time:(d.train&&d.train.time)||plan().pre.defaultTime}); writeDoc(pk("day-")+UI.date,d);
    if(ev.target.checked) toast(`Treningsdag: +${r0(trainExtra(UI.date))} kcal i dag`); }
  if(ev.target.id==="trainExtra"){ const d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; const x=Math.max(0,Math.round(numIn(ev.target.value)));
    d.train=Object.assign({on:true},d.train,{extra:x}); writeDoc(pk("day-")+UI.date,d); toast(`+${x} kcal i dag`); }
  if(ev.target.id==="calcWake" && ev.target.value){ UI.calcWake=ev.target.value; render(); }
  if(ev.target.id==="calcTrain"){ UI.calcTrain=ev.target.checked; render(); }
  if(ev.target.id==="calcTrainT" && ev.target.value){ UI.calcTrainT=ev.target.value; render(); }
  if(ev.target.id==="trainTime" && ev.target.value){ const d=clone(dayDoc(UI.date)); d.kind="day"; d.date=UI.date; d.train={on:true,time:ev.target.value}; writeDoc(pk("day-")+UI.date,d);
    const pr=clone(S.docs[pk("profile")]||{kind:"profile"}); pr.kind="profile"; const pl=plan(); pl.pre.defaultTime=ev.target.value; pr.plan=pl; writeDoc(pk("profile"),pr); }
});
function savePlanForm(){
  const pr=clone(S.docs[pk("profile")]||{kind:"profile"}); pr.kind="profile"; const pl=plan(), wasOn=pl.reminders;
  const el=id=>document.getElementById(id);
  if(el("plWake")&&el("plWake").value) pl.defaultWake=el("plWake").value;
  for(const [k] of MEALS){ if(k==="pre"||!el("plOn-"+k)) continue; pl.slots[k].on=el("plOn-"+k).checked;
    if(el("plOff-"+k)) pl.slots[k].off=Number(el("plOff-"+k).value); if(el("plTpl-"+k)) pl.slots[k].tpl=el("plTpl-"+k).value; }
  if(el("plPre")) pl.pre.before=Number(el("plPre").value);
  if(el("plExtra")) pl.pre.extraKcal=Math.max(0,Math.round(numIn(el("plExtra").value)));
  if(el("plTrain")&&el("plTrain").value) pl.pre.defaultTime=el("plTrain").value;
  if(el("plPreTpl")) pl.pre.tpl=el("plPreTpl").value;
  if(el("plRem")) pl.reminders=el("plRem").checked;
  pr.plan=pl; writeDoc(pk("profile"),pr);
  if(pl.reminders&&!wasOn&&notifState()!=="granted"&&window.Android&&Android.requestNotifPermission) Android.requestNotifPermission();
}
document.addEventListener("focusin", ev=>{ const t=ev.target;
  if(t && t.matches && t.matches('input[inputmode="decimal"],input[inputmode="numeric"]')) setTimeout(()=>{ try{ t.select(); }catch(e){} },0); });
document.addEventListener("keydown", ev=>{
  if(ev.key!=="Enter") return; const t=ev.target; if(!t||t.tagName!=="INPUT"||t.id==="q"||t.id==="bcIn"||t.type==="checkbox") return;
  const scope=t.closest(".sheet")||t.closest(".card"); const btn=scope&&scope.querySelector('.btn.primary:not([disabled]):not(.plus),[data-act="waterSave"]');
  ev.preventDefault(); if(btn) btn.click(); else t.blur(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && UI.sheet) closeSheet(); if(ev.key==="Enter" && ev.target.id==="bcIn") handleCode(ev.target.value); });

$("#fileBarcode").addEventListener("change", async ev=>{
  const file=ev.target.files[0]; ev.target.value=""; if(!file) return;
  if(!UI.sheet||UI.sheet.type!=="scan") openSheet({type:"scan",meal:UI.sheet?UI.sheet.meal:guessMeal()});
  const s=UI.sheet; s.img=await fileToURL(await shrink(file,900)); s.busy="Leser strekkoden …"; s.msg=""; s.err=false; renderSheet();
  try{ const code=await decodeBarcode(file); s.busy="";
    if(code){ s.code=code; handleCode(code); return; }
    s.msg="Fant ingen strekkode i bildet. Prøv igjen nærmere og med bedre lys, eller skriv inn tallene."; s.err=true;
  }catch(e){ s.busy=""; s.msg=aiErr(e); s.err=true; }
  if(UI.sheet===s) renderSheet();
});
$("#fileLabel").addEventListener("change", async ev=>{ const file=ev.target.files[0]; ev.target.value=""; if(file&&SAMPLE) readLabel(file); });
$("#fileMeal").addEventListener("change", async ev=>{ const file=ev.target.files[0]; ev.target.value=""; if(!file||!UI.sheet) return;
  UI.sheet.blob=await shrink(file); UI.sheet.img=await fileToURL(await shrink(file,900)); renderSheet(); });

render();
initStore();
</script>
